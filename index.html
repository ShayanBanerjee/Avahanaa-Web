<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Avahanaa – Quick Vehicle Notifications</title>
    <meta name="description" content="Avahanaa enables quick, private notifications to vehicle owners via QR codes. Scan a QR, choose a reason and notify the owner instantly. Built with privacy and convenience in mind." />
    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="./logo.jpg" />
    <!--
      Plus Jakarta Sans for display, Inter for body — the same two faces the
      Flutter app bundles. The app and this page are the same product seen from
      two ends of one interaction, and until now they did not look related.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <!--
      Bootstrap's grid and components, but NOT its palette. Bootswatch Flatly
      used to sit on top of this and was the source of the teal-and-mint look;
      the theme layer below replaces it entirely by overriding Bootstrap's own
      CSS variables, so the markup never had to change.
    -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css"
    />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
    />
    <!-- Font Awesome (optional for richer iconography) -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      /* ===================================================================
         Avahanaa web theme
         ===================================================================

         One brand, two ends of the same interaction. The owner sees the
         Flutter app; the stranger at the windscreen sees this page. Until
         now they shared a name and nothing else — this page was Bootswatch
         Flatly's teal and mint, the app was a corporate blue, and neither
         looked like the other.

         Both are now machined graphite with a warm bronze light source. The
         tokens below are the same values as `lib/theme/app_theme.dart`, so a
         change on one side is a visible mismatch rather than a silent drift.

         Bootstrap's own CSS variables are overridden rather than its classes
         replaced, which is why none of the JSX had to change.
      ------------------------------------------------------------------- */

      :root {
        /* Brand — the graphite ramp, matching MetalPalette.brand */
        --av-graphite-lift: #333a44;
        --av-graphite: #23282f;
        --av-graphite-core: #1a1e24;
        --av-graphite-depth: #101317;
        /* The warm corner. One stop, and it is what stops the hero reading
           as a grey rectangle. */
        --av-bronze-glow: #3a2e1e;

        /* Accent — bronze as ink on light, amber as ink on dark. It has to be
           both: `primary` is used for links on white AND for fills under
           white, and a single bright amber cannot do both. #E8A33D on white
           is 1.9:1. */
        --av-bronze: #8a5a18;
        --av-bronze-dark: #6e4712;
        --av-amber: #e8a33d;

        /* Signals. Red is reserved: it means "an alert" or "this destroys
           data", and nothing else. */
        --av-alert: #c81b30;
        --av-alert-deep: #a01625;
        --av-success: #10b981;
        --av-success-ink: #047857;
        --av-warning: #c2410c;

        /* Neutrals run warm, so they sit with the bronze. A cool grey beside
           bronze reads faintly green — the same reason they used to be
           blue-slate beside the old blue. */
        --av-bg: #faf9f7;
        --av-surface: #ffffff;
        --av-surface-muted: #f4f2ef;
        --av-ink: #1a1814;
        --av-ink-2: #55504a;
        --av-ink-3: #736c63;
        --av-line: #e6e1da;
        --av-line-strong: #cfc8be;

        --av-radius-control: 12px;
        --av-radius-card: 14px;
        --av-radius-hero: 20px;

        /* Depth comes from a hairline and a very soft shadow, never from a
           heavy drop shadow. Premium surfaces are milled, not floating. */
        --av-shadow-card: 0 1px 2px rgba(26, 24, 20, 0.04),
          0 8px 24px -12px rgba(26, 24, 20, 0.12);
        --av-shadow-lift: 0 2px 6px rgba(26, 24, 20, 0.06),
          0 18px 40px -20px rgba(26, 24, 20, 0.28);

        /* Bootstrap's own variables, so its components inherit all of this */
        --bs-primary: #8a5a18;
        --bs-primary-rgb: 138, 90, 24;
        --bs-body-bg: var(--av-bg);
        --bs-body-color: var(--av-ink);
        --bs-body-font-family: 'Inter', system-ui, -apple-system, sans-serif;
        --bs-border-color: var(--av-line);
        --bs-link-color: var(--av-bronze);
        --bs-link-hover-color: var(--av-bronze-dark);
        --bs-secondary-color: var(--av-ink-2);
        --bs-emphasis-color: var(--av-ink);
      }

      /* Night. The scan page is used at 11pm by somebody who has been blocked
         in, and a full-white page in a dark car park is its own small
         hostility. Accents lift, because bronze on near-black is unreadable
         at 2.4:1 — the amber is the same swap the app makes. */
      @media (prefers-color-scheme: dark) {
        :root {
          --av-bg: #121110;
          --av-surface: #1c1a17;
          --av-surface-muted: #262320;
          --av-ink: #f5f2ee;
          --av-ink-2: #b8b0a6;
          --av-ink-3: #9a9289;
          --av-line: #322e29;
          --av-line-strong: #4a443d;
          --av-bronze: #e8a33d;
          --av-bronze-dark: #f0b95f;
          --av-alert: #ff6b7a;
          --av-alert-deep: #ff8d98;
          --av-success: #34d399;
          --av-success-ink: #6ee7b7;
          --av-warning: #fb923c;
          --av-shadow-card: 0 1px 2px rgba(0, 0, 0, 0.5),
            0 8px 24px -12px rgba(0, 0, 0, 0.7);
          --av-shadow-lift: 0 2px 6px rgba(0, 0, 0, 0.55),
            0 18px 40px -20px rgba(0, 0, 0, 0.9);
          --bs-primary: #e8a33d;
          --bs-primary-rgb: 232, 163, 61;
          --bs-link-color: #e8a33d;
          --bs-link-hover-color: #f0b95f;
        }
      }

      /* --- Base ------------------------------------------------------- */

      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background-color: var(--av-bg);
        color: var(--av-ink);
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        font-size: 1rem;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      h1, h2, h3, h4, .display-1, .display-2, .display-3, .display-4,
      .card-title, .navbar-brand {
        font-family: 'Plus Jakarta Sans', 'Inter', system-ui, sans-serif;
        font-weight: 700;
        color: var(--av-ink);
        /* Optical tracking: counters and side-bearings scale with the glyph,
           so one letter-spacing value across the whole scale leaves large
           headings looking gappy. */
        letter-spacing: -0.02em;
      }
      .display-4 {
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1.1;
      }
      p { line-height: 1.65; margin-bottom: 1rem; color: var(--av-ink-2); }
      .lead { font-size: 1.125rem; color: var(--av-ink-2); }
      .text-muted { color: var(--av-ink-3) !important; }
      .text-primary { color: var(--av-bronze) !important; }
      .text-success { color: var(--av-success-ink) !important; }

      /* An overline: the small letterspaced label above a heading. Bootstrap
         has no equivalent, and it is most of what makes a section read as
         considered rather than assembled. */
      .av-overline {
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--av-ink-3);
        margin-bottom: 0.5rem;
      }

      /* --- Hero ------------------------------------------------------- */

      .hero {
        position: relative;
        overflow: hidden;
        background:
          radial-gradient(
            120% 140% at 88% 108%,
            var(--av-bronze-glow) 0%,
            transparent 58%
          ),
          linear-gradient(
            150deg,
            var(--av-graphite-lift) 0%,
            var(--av-graphite) 28%,
            var(--av-graphite-core) 62%,
            var(--av-graphite-depth) 100%
          );
        color: #ffffff;
        padding: 6rem 1.25rem 6.5rem;
        text-align: center;
      }
      @media (max-width: 575.98px) {
        /* On a phone the hero was pushing everything below it off the fold,
           and the thing below it is the explanation of what this is. */
        .hero { padding: 3.5rem 1.25rem 4rem; }
      }
      /* A single specular band, low and wide. Real metal has one bright edge
         and a fast falloff; a symmetric sheen reads as plastic. */
      .hero::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(
          104deg,
          transparent 34%,
          rgba(255, 255, 255, 0.055) 47%,
          transparent 60%
        );
        pointer-events: none;
      }
      .hero > * { position: relative; }
      .hero h1 {
        color: #ffffff;
        font-weight: 800;
        font-size: clamp(2.2rem, 5.4vw, 3.4rem);
        letter-spacing: -0.035em;
        margin-bottom: 1rem;
      }
      .hero p {
        color: rgba(255, 255, 255, 0.82);
        font-size: 1.125rem;
        max-width: 660px;
        margin: 0 auto;
      }
      /*
        On the hero, the primary button inverts.

        Everywhere else the primary action is graphite, because it sits on
        warm white and graphite is the strongest thing that can. On the hero
        that same button is graphite on graphite — it was very nearly
        invisible, which is a poor property for the one control the page
        exists to get pressed.

        Amber on near-black is the accent doing the job it is for, and it is
        the only place on the site where the amber appears at full strength.
      */
      .hero .btn-primary {
        background: linear-gradient(180deg, #f0b95f, var(--av-amber));
        border-color: rgba(0, 0, 0, 0.25);
        color: var(--av-graphite-depth);
        box-shadow: 0 10px 30px -12px rgba(232, 163, 61, 0.55);
      }
      .hero .btn-primary:hover,
      .hero .btn-primary:focus {
        background: linear-gradient(180deg, #f7cd88, #f0b95f);
        border-color: rgba(0, 0, 0, 0.25);
        color: var(--av-graphite-depth);
        box-shadow: 0 14px 38px -12px rgba(232, 163, 61, 0.7);
      }
      /* A secondary action on the hero stays quiet: a hairline of white. */
      .hero .btn-secondary,
      .hero .btn-outline-secondary {
        border-color: rgba(255, 255, 255, 0.32);
        color: #ffffff;
      }
      .hero .btn-secondary:hover,
      .hero .btn-outline-secondary:hover {
        background-color: rgba(255, 255, 255, 0.08);
        border-color: rgba(255, 255, 255, 0.5);
        color: #ffffff;
      }

      /* --- Surfaces --------------------------------------------------- */

      .card {
        background-color: var(--av-surface);
        border: 1px solid var(--av-line);
        border-radius: var(--av-radius-card);
        box-shadow: var(--av-shadow-card);
        position: relative;
      }
      /* One hairline of light along the top edge. This is the whole
         difference between a filled rectangle and a milled one. */
      .card::after {
        content: '';
        position: absolute;
        inset: 0 0 auto 0;
        height: 1px;
        border-radius: var(--av-radius-card) var(--av-radius-card) 0 0;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.7),
          transparent
        );
        pointer-events: none;
      }
      @media (prefers-color-scheme: dark) {
        .card::after {
          background: linear-gradient(
            90deg,
            transparent,
            rgba(255, 255, 255, 0.08),
            transparent
          );
        }
      }
      .card-body { padding: 1.5rem; }
      .card-title { font-size: 1.125rem; margin-bottom: 0.4rem; }
      .card-text { color: var(--av-ink-2); }
      .shadow-sm { box-shadow: var(--av-shadow-card) !important; }
      .notification-card { max-width: 680px; margin: 2.5rem auto; }

      /* --- Buttons ---------------------------------------------------- */

      .btn {
        border-radius: var(--av-radius-control);
        font-weight: 600;
        letter-spacing: 0.01em;
        padding: 0.75rem 1.4rem;
        transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1),
          box-shadow 0.18s ease, background-color 0.18s ease,
          border-color 0.18s ease;
      }
      .btn:active { transform: scale(0.985); }

      /* The primary action is graphite, not bronze. Bronze is the accent —
         used as ink for links and selected states — and a page where every
         button is the accent colour has no hierarchy. */
      .btn-primary {
        background: linear-gradient(
          180deg,
          var(--av-graphite-lift),
          var(--av-graphite-core)
        );
        border: 1px solid var(--av-graphite-depth);
        color: #ffffff;
        box-shadow: var(--av-shadow-card);
      }
      .btn-primary:hover,
      .btn-primary:focus {
        background: linear-gradient(
          180deg,
          #3c4450,
          var(--av-graphite)
        );
        border-color: var(--av-graphite-depth);
        color: #ffffff;
        box-shadow: var(--av-shadow-lift);
      }
      .btn-primary:disabled,
      .btn-primary.disabled { opacity: 0.5; box-shadow: none; }

      .btn-secondary,
      .btn-outline-secondary {
        background-color: transparent;
        border: 1px solid var(--av-line-strong);
        color: var(--av-ink);
      }
      .btn-secondary:hover,
      .btn-outline-secondary:hover {
        background-color: var(--av-surface-muted);
        border-color: var(--av-ink-3);
        color: var(--av-ink);
      }
      .btn-success {
        background-color: var(--av-success-ink);
        border-color: var(--av-success-ink);
      }
      .btn-danger {
        background-color: var(--av-alert);
        border-color: var(--av-alert);
      }
      .btn-lg { padding: 0.95rem 1.75rem; font-size: 1.0625rem; }

      /* --- The reason grid -------------------------------------------- */
      /*
        The single most important control on the site: it is what a stranger
        standing in the road actually taps, often one-handed, often in a
        hurry. Big targets, obvious selected state, no ambiguity.
      */
      .reason-buttons button {
        /*
          Set Bootstrap's own variables rather than fighting its specificity.
          `.btn:hover` and `.btn:focus` resolve their border from
          `--bs-btn-hover-border-color`, which for a bare `.btn` fell back to
          the emphasis colour — a near-black ring that appeared on hover and
          then *stuck* after a tap, sitting next to the bronze ring that means
          "selected". Two rings, two meanings, no way to tell them apart.
        */
        --bs-btn-bg: var(--av-surface);
        --bs-btn-color: var(--av-ink);
        --bs-btn-border-color: var(--av-line);
        --bs-btn-hover-bg: var(--av-surface-muted);
        --bs-btn-hover-color: var(--av-ink);
        --bs-btn-hover-border-color: var(--av-line-strong);
        --bs-btn-active-bg: var(--av-surface-muted);
        --bs-btn-active-color: var(--av-ink);
        --bs-btn-active-border-color: var(--av-line-strong);
        --bs-btn-focus-shadow-rgb: 138, 90, 24;
        width: 100%;
        min-height: 56px;
        border-radius: var(--av-radius-control);
        padding: 0.85rem 1rem;
        font-size: 0.975rem;
        font-weight: 500;
        text-align: left;
        white-space: normal;
        display: flex;
        align-items: center;
        gap: 0.75rem;
        background-color: var(--av-surface);
        border: 1px solid var(--av-line);
        color: var(--av-ink);
        box-shadow: none;
      }
      .reason-buttons button i {
        font-size: 1.15rem;
        color: var(--av-ink-3);
        transition: color 0.18s ease;
        margin-right: 0;
      }
      .reason-buttons button:hover {
        border-color: var(--av-line-strong);
        background-color: var(--av-surface-muted);
      }
      .reason-buttons button.active,
      .reason-buttons button.active:hover,
      .reason-buttons button.active:focus {
        background-color: var(--av-surface) !important;
        color: var(--av-ink) !important;
        /* Two rings rather than a fill: a filled selected state at this size
           is a slab of colour that competes with the send button, which is
           the thing they are meant to press next. */
        border-color: var(--av-bronze) !important;
        box-shadow: 0 0 0 3px rgba(138, 90, 24, 0.14);
      }
      .reason-buttons button.active i,
      .reason-buttons button.active:hover i { color: var(--av-bronze); }

      /* A tap leaves focus behind on mobile. Keyboard users still get a ring
         — `:focus-visible` — but a thumb should not leave one on a control it
         has already finished with. */
      .reason-buttons button:focus:not(:focus-visible) {
        box-shadow: none;
      }
      @media (prefers-color-scheme: dark) {
        .reason-buttons button.active {
          box-shadow: 0 0 0 3px rgba(232, 163, 61, 0.18);
        }
      }

      /* --- Forms ------------------------------------------------------ */

      .form-label {
        font-weight: 600;
        font-size: 0.875rem;
        color: var(--av-ink-2);
        margin-bottom: 0.4rem;
      }
      .form-control,
      textarea.form-control {
        background-color: var(--av-surface);
        border: 1px solid var(--av-line-strong);
        border-radius: var(--av-radius-control);
        color: var(--av-ink);
        padding: 0.8rem 1rem;
        font-size: 1rem;
      }
      .form-control::placeholder { color: var(--av-ink-3); }
      .form-control:focus,
      textarea.form-control:focus {
        background-color: var(--av-surface);
        border-color: var(--av-bronze);
        color: var(--av-ink);
        box-shadow: 0 0 0 3px rgba(138, 90, 24, 0.16);
      }
      @media (prefers-color-scheme: dark) {
        .form-control:focus,
        textarea.form-control:focus {
          box-shadow: 0 0 0 3px rgba(232, 163, 61, 0.2);
        }
      }

      /* --- Alerts ----------------------------------------------------- */

      .alert {
        border-radius: var(--av-radius-card);
        border: 1px solid transparent;
        padding: 1rem 1.15rem;
        font-size: 0.95rem;
      }
      .alert-success {
        background-color: rgba(16, 185, 129, 0.09);
        border-color: rgba(16, 185, 129, 0.28);
        color: var(--av-success-ink);
      }
      .alert-danger {
        background-color: rgba(200, 27, 48, 0.08);
        border-color: rgba(200, 27, 48, 0.26);
        color: var(--av-alert-deep);
      }
      .alert-warning {
        background-color: rgba(194, 65, 12, 0.09);
        border-color: rgba(194, 65, 12, 0.26);
        color: var(--av-warning);
      }
      .alert-info {
        background-color: var(--av-surface-muted);
        border-color: var(--av-line);
        color: var(--av-ink-2);
      }

      /* --- Chrome ----------------------------------------------------- */

      .navbar.bg-dark,
      .navbar {
        background-color: var(--av-graphite-core) !important;
        border-bottom: 1px solid rgba(255, 255, 255, 0.07);
        padding-top: 0.9rem;
        padding-bottom: 0.9rem;
      }
      .navbar-brand {
        color: #ffffff !important;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .navbar .nav-link {
        color: rgba(255, 255, 255, 0.74) !important;
        font-weight: 500;
        transition: color 0.15s ease;
      }
      .navbar .nav-link:hover,
      .navbar .nav-link.active { color: #ffffff !important; }

      .footer {
        background-color: var(--av-graphite-core);
        color: rgba(255, 255, 255, 0.72);
        padding: 3rem 0;
        margin-top: auto;
        border-top: 1px solid rgba(255, 255, 255, 0.07);
      }
      .footer a { color: rgba(255, 255, 255, 0.9); text-decoration: none; }
      .footer a:hover { color: var(--av-amber); }

      /* --- How it works ----------------------------------------------- */

      .how-it-works .step-icon {
        font-size: 1.6rem;
        color: var(--av-bronze);
        width: 60px;
        height: 60px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 18px;
        background-color: rgba(138, 90, 24, 0.09);
        border: 1px solid rgba(138, 90, 24, 0.18);
        margin-bottom: 0.25rem;
      }
      @media (prefers-color-scheme: dark) {
        .how-it-works .step-icon {
          background-color: rgba(232, 163, 61, 0.12);
          border-color: rgba(232, 163, 61, 0.24);
        }
      }

      /* --- Accessibility ---------------------------------------------- */

      :focus-visible {
        outline: 2px solid var(--av-bronze);
        outline-offset: 2px;
      }
      /* Honour the system setting. The sheen and the press physics are
         decoration; somebody who has asked for less motion has asked for
         less of exactly this. */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.001ms !important;
          transition-duration: 0.001ms !important;
        }
        .btn:active { transform: none; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- Firebase compat SDKs to share config with the Flutter app -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-functions-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics-compat.js"></script>
    <!-- QR code scanner library -->
    <script src="https://unpkg.com/html5-qrcode" ></script>
    <!-- React and ReactDOM via CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <!-- Babel for JSX transpiling -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
      // Avahanaa – Vehicle Notification Frontend
      // This single-page application has three main pages: Home, Contact and Notify.
      // QR codes can be scanned with the device camera or resolved manually through the URL parameters.
      // Once a QR id is resolved the corresponding user's FCM token is fetched from Firestore.
      // A notification is delivered by calling a Firebase Cloud Function that sends FCM securely.

      const { useState, useEffect, useMemo, useRef, useCallback } = React;

      const QR_ENCRYPTION_DEFAULT_KEY = "0123456789abcdef0123456789abcdef";
      const QR_ENCRYPTION_DEFAULT_IV = "abcdef9876543210";
      const qrTextEncoder = new TextEncoder();
      const qrTextDecoder = new TextDecoder();
      const qrSubtleCrypto =
        (window.crypto && (window.crypto.subtle || window.crypto.webkitSubtle)) ||
        null;

      function getQrEncryptionConfig() {
        const overrideKey =
          (window.QR_ENCRYPTION_KEY || window.__QR_ENCRYPTION_KEY || "").trim();
        const overrideIv =
          (window.QR_ENCRYPTION_IV || window.__QR_ENCRYPTION_IV || "").trim();
        return {
          key: overrideKey || QR_ENCRYPTION_DEFAULT_KEY,
          iv: overrideIv || QR_ENCRYPTION_DEFAULT_IV,
        };
      }

      function applyPkcs7Padding(bytes) {
        const blockSize = 16;

        const pad = remainder === 0 ? blockSize : blockSize - remainder;
        const padded = new Uint8Array(bytes.length + pad);
        padded.set(bytes);

        const padding = (4 - (normalised.length % 4 || 4)) % 4;

        for (let i = bytes.length - pad; i < bytes.length; i += 1) {

          }

        if (![16, 24, 32].includes(keyBytes.length)) {

          "raw",
          keyBytes,
          { name: "AES-CBC" },
          false,
          ["decrypt"]
        );

          { name: "AES-CBC", iv: ivBytes },
          cryptoKey,

        const parsed = JSON.parse(jsonString);

        const toTrimmedString = (value) => {
          if (value == null) return "";
          if (typeof value === "string") return value.trim();
          if (typeof value === "number" || typeof value === "boolean") {
            return String(value).trim();
          }
          return "";

          toTrimmedString(versionHint) ||
          toTrimmedString(parsed.version) ||
          toTrimmedString(parsed.payloadVersion);
        const vehicleDetails =
          parsed.vehicle && typeof parsed.vehicle === "object"
            ? parsed.vehicle
            : {};
        const carDetailSource =
          Object.keys(vehicleDetails).length
            ? vehicleDetails
            : parsed.carDetails && typeof parsed.carDetails === "object"
            ? parsed.carDetails
            : parsed;
        const cleanCarDetails = {};

        // See DEPLOY.md, "Legacy encrypted stickers".
        const userId = toTrimmedString(
          parsed.userId ||
            (parsed.metadata &&
            typeof parsed.metadata === "object"
              ? parsed.metadata.userId

          parsed.vehicleId ||
            (vehicleDetails && typeof vehicleDetails.id === "string"
              ? vehicleDetails.id

            (parsed.metadata &&
            typeof parsed.metadata === "object"
              ? parsed.metadata.vehicleId
              : "")
        );
        if (vehicleId) {
          result.vehicleId = vehicleId;
        }
        const qrCodeId = toTrimmedString(
          parsed.qrCodeId ||
            parsed.qrId ||
            (parsed.metadata &&
            typeof parsed.metadata === "object"
              ? parsed.metadata.qrCodeId
              : "")
        );
        if (qrCodeId) {
          result.qrCodeId = qrCodeId;
        }
        if (parsed.contact && typeof parsed.contact === "object") {
          const contact = {};
          const email = toTrimmedString(parsed.contact.email);
          if (email) {
            contact.email = email;
          }
          const phoneNumber = toTrimmedString(
            parsed.contact.phoneNumber || parsed.contact.phone
          );
          if (phoneNumber) {

          }

      function normalisePlate(value) {

      async function encryptQrPayload(details) {

        const paddedBytes = applyPkcs7Padding(payloadBytes);
        const { key, iv } = getQrEncryptionConfig();
        const keyBytes = qrTextEncoder.encode(key);
        if (![16, 24, 32].includes(keyBytes.length)) {
          throw new Error("QR encryption key must be 16, 24, or 32 bytes.");
        }
        const ivBytes = qrTextEncoder.encode(iv);
        if (ivBytes.length !== 16) {
          throw new Error("QR encryption IV must be 16 bytes.");
        }
        const cryptoKey = await qrSubtleCrypto.importKey(
          "raw",
          keyBytes,
          { name: "AES-CBC" },
          false,
          ["encrypt"]
        );
        const encryptedBuffer = await qrSubtleCrypto.encrypt(
          { name: "AES-CBC", iv: ivBytes },
          cryptoKey,
          paddedBytes

      /**
       * ---------------------------------------------------------------
       * Data access
       * ---------------------------------------------------------------
       *
       * Everything below talks to the backend over /api/*. None of it touches
       * Firestore.
       *
       * That is the whole point. The previous version of this file resolved a
       * scan by reading `qrCodes/{id}`, then `users/{userId}`, then that
       * user's `vehicles` subcollection — from the browser of a stranger who
       * had just walked up to somebody's car. It pulled `fcmToken` and
       * `phoneNumber` into the page and handed the token back to the server to
       * push with.
       *
       * Two things were wrong with that. The owner's phone number was sitting
       * in a stranger's browser, which is the exact thing this product
       * promises never happens. And a server that accepts a token from the
       * client will push whatever anyone sends it.
       *
       * So resolution and sending both moved behind the Admin SDK, and the
       * Firestore rules now refuse these reads outright. The page below never
       * learns who the owner is — it gets a colour, a model and a plate, the
       * same three things already printed on the sticker.
       */

      /** Everything the server will tell us about a vehicle, and no more. */
      function emptyOwnerRecord() {
        return {
          id: "",
          qrCodeId: "",
          // The server is the authority on this and answers 404 for a code
          // that is missing *or* switched off, so anything we hold a record
          // for is active by definition. Kept as a field because the render
          // path below still reads it.
          isActive: true,
          // Retained so the components reading them keep working, and as a
          // standing reminder that the client is never given either one.
          fcmToken: "",
          userId: "",
          licensePlate: "",
          carDetails: { color: "", carModel: "", licensePlate: "" },
        };
      }

      function ownerRecordFromApi(data) {
        const vehicle = (data && data.vehicle) || {};
        const record = emptyOwnerRecord();
        record.id = data.qrCodeId || "";
        record.qrCodeId = data.qrCodeId || "";
        record.licensePlate = vehicle.licensePlate || "";
        record.carDetails = {
          color: vehicle.color || "",
          carModel: vehicle.carModel || "",
          licensePlate: vehicle.licensePlate || "",
        };
        return record;
      }

      /**
       * A missing code and a deactivated code deliberately look identical.
       *
       * `isActive: false` is the owner's off switch and the server honours it,
       * but if this page said "that code exists but is switched off" it would
       * become a way to test which codes are real.
       */
      const NOT_ACTIVE_MESSAGE =
        "This code is not active. Please check you scanned an Avahanaa sticker.";

      /**
       * In-flight GETs, keyed by path.
       *
       * Two effects resolve the same QR on mount — one to fill the vehicle
       * description, one to arm the notify target — so without this the page
       * opens with two identical round trips. On a normal page that is
       * untidy; here it is the first thing that happens after someone scans a
       * sticker, on Indian mobile data, while they are standing in the road.
       *
       * Only the promise is shared, and only while it is pending, so a later
       * resolve still re-fetches. Nothing is cached across attempts — a code
       * that was deactivated between two tries must come back 404.
       */
      const inFlightGets = new Map();

      async function apiGet(path) {
        if (inFlightGets.has(path)) return inFlightGets.get(path);
        const pending = apiGetUncached(path).finally(() => {
          inFlightGets.delete(path);
        });
        inFlightGets.set(path, pending);
        return pending;
      }

      async function apiGetUncached(path) {
        const response = await fetch(path, {
          method: "GET",
          headers: { Accept: "application/json" },
        });
        if (response.status === 404) return null;
        if (!response.ok) {
          const detail = await response.json().catch(() => null);
          throw new Error(
            (detail && detail.error && detail.error.message) ||
              "We could not reach Avahanaa. Please check your connection."
          );
        }
        return response.json();
      }

       * Resolves a scanned QR code to its vehicle description.
       */
      async function fetchOwnerByQr(qrCodeId) {
        if (!qrCodeId) return null;
        try {
          const data = await apiGet(
            `/api/qr/${encodeURIComponent(qrCodeId)}`
          );
          return data ? ownerRecordFromApi(data) : null;
        } catch (error) {
          console.error("Could not resolve QR code", error);
          return null;
        }

       *
       * The plate branch is a server lookup now (`/api/lookup`) rather than a
       * Firestore query over `users`. It answers with a `qrCodeId` and the
       * vehicle description — never an owner — and it is rate-limited per IP,
       * because unlike a sticker a plate can simply be guessed.
       */
      async function fetchUserByIdOrPlate(identifier) {
        if (!identifier) return null;
        const raw = String(identifier).trim();
        if (!raw) return null;

        const direct = await fetchOwnerByQr(raw);
        if (direct) return direct;

        try {
          const data = await apiGet(
            `/api/lookup?plate=${encodeURIComponent(raw)}`
          );
          return data ? ownerRecordFromApi(data) : null;

          console.error("Could not look up that registration number", error);

        }

      /**
       * Sends the alert.
       *
       * The request carries a QR id, a reason code and a note — that is all
       * the server accepts. It resolves the owner itself and pushes with its
       * own credentials, so there is no title, no body and no token here to
       * tamper with.
       */
      /**
       * Where the vehicle is, if the person scanning is willing to say.
       *
       * The owner's first question on getting an alert is "which car, and
       * where?" — they may have three vehicles and no idea which windscreen
       * was scanned. A coordinate answers it in one line.
       *
       * Three rules, and they are the reason this is defensible at all:
       *
       * 1. **Never blocking.** The alert is the product; the location is a
       *    nicety. A permission prompt somebody ignores must not stop the
       *    button working, so this resolves to null after six seconds no
       *    matter what the browser is doing.
       * 2. **Never silent.** The browser's own prompt is the consent, and it
       *    only appears after the reason has been chosen, so nobody is asked
       *    for their location before they know what they are sending.
       * 3. **Never precise.** The server rounds to three decimals (~110 m)
       *    before storing. That is enough to find a parked car and not enough
       *    to follow a person — and the person scanning is a stranger doing a
       *    favour, who is owed the same anonymity the owner gets.
       */
      function captureScanLocation() {
        return new Promise((resolve) => {
          if (!navigator.geolocation) {
            resolve(null);
            return;
          }

          let settled = false;
          const finish = (value) => {
            if (settled) return;
            settled = true;
            resolve(value);
          };

          // Belt as well as braces: `timeout` below covers a slow fix, but not
          // a browser that never calls back at all — which is what a dismissed
          // (rather than denied) permission prompt does on some mobile
          // browsers, and somebody is standing in the street waiting.
          const giveUp = setTimeout(() => finish(null), 6000);

          navigator.geolocation.getCurrentPosition(
            (position) => {
              clearTimeout(giveUp);
              finish({
                lat: position.coords.latitude,
                lng: position.coords.longitude,
                accuracyM: position.coords.accuracy,
              });
            },
            () => {
              clearTimeout(giveUp);
              finish(null);
            },
            {
              enableHighAccuracy: false,
              timeout: 5000,
              // A fix from the last two minutes is fine and costs no radio
              // time. Nobody has walked far since.
              maximumAge: 120000,
            }
          );
        });
      }

      async function triggerNotifyFunction(payload) {
        try {
          const response = await fetch("/api/notify", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              qrCodeId: payload.qrCodeId || payload.qrId || "",
              reason: payload.reason || "other",
              message: payload.message || "",
              // Omitted entirely when it was declined or unavailable, rather
              // than sent as nulls. The server treats a missing field and a
              // refused one identically, and there is no reason to describe
              // somebody's refusal on the wire.
              ...(payload.location ? { location: payload.location } : {}),
            }),
          });

          if (response.ok) {
            const data = await response.json().catch(() => ({}));
            return {
              ok: true,
              notificationId: data.notificationId || "",
              // The capability that lets this page ask, later, whether the
              // owner answered. Held in memory only — it is deliberately not
              // put in the URL or in storage, because it unlocks one alert's
              // reply status and a URL gets shared.
              statusToken: data.statusToken || "",
            };
          }

          const detail = await response.json().catch(() => null);
          const code = detail && detail.error && detail.error.code;

          // The owner has been alerted already and this is a repeat within the
          // window. Saying so plainly matters: someone standing at the car who
          // thinks nothing happened will keep pressing the button.
          if (response.status === 429) {
            return {
              ok: false,
              alreadyAlerted: true,
              message:
                "The owner has already been alerted about this vehicle and is on their way. Please give them a few minutes.",
            };
          }

          if (response.status === 404) {
            return { ok: false, message: NOT_ACTIVE_MESSAGE };
          }

          return {
            ok: false,
            message:
              (detail && detail.error && detail.error.message) ||
              "We could not send that alert. Please try again.",
            code: code || "",
          };
        } catch (error) {
          console.error("Notification request failed", error);
          return {
            ok: false,
            message:
              "We could not reach Avahanaa. Please check your connection and try again.",
          };
        }
      }

              }
              candidateParams.forEach((value, key) => {
                if (value != null && value !== "") {
                  params.set(key, value);
                }
              });
            } catch (err) {
              // Not a URL, fall back to using the decoded string directly.
            }

            if (!params.has("qr") && identifier) {
              params.set("qr", identifier);
            }

            if (!params.has("payload")) {
              const detailKeys = ["carModel", "licensePlate", "color"];
              const detailPayload = {};
              detailKeys.forEach((key) => {
                const rawValue = params.get(key);
                if (typeof rawValue === "string" && rawValue.trim()) {
                  detailPayload[key] = rawValue.trim();
                }
              });
              if (Object.keys(detailPayload).length > 0) {
                try {
                  const encrypted = await encryptQrPayload(detailPayload);
                  if (encrypted) {
                    params.set("payload", encrypted);
                    if (!params.has("v")) {
                      params.set("v", "1");
                    }
                    detailKeys.forEach((key) => params.delete(key));
                  }
                } catch (encryptionError) {
                  console.warn(
                    "Failed to encrypt car details for QR redirect",
                    encryptionError
                  );
                }
              }
            }

            params.set("page", "notify");
            const targetHref = `./index.html${
              params.toString() ? `?${params.toString()}` : ""
            }`;

            try {
              await cleanupScanner();
            } catch (cleanupErr) {
              console.warn("Scanner cleanup failed", cleanupErr);
            }
            setScanning(false);
            setInitialisingCamera(false);
            setCameraError("");
            window.location.href = targetHref;
          },
          [cleanupScanner]
        );

        const startScan = useCallback(
          async (preferredCameraId) => {
            const Html5Qrcode = window.Html5Qrcode;
            if (!Html5Qrcode) {
              setCameraError(
                "QR scanner module failed to load. Please refresh the page."
              );
              return;
            }
            if (typeof window !== "undefined" && !window.isSecureContext) {
              setCameraError(
                "Camera access is blocked because this page is not loaded over HTTPS. Please open the secure Avahanaa site."
              );
              return;
            }
            setCameraError("");
            setScanning(true);
            setInitialisingCamera(true);
            hasProcessedScanRef.current = false;
            try {
              await requestCameraPermission();
              let cameras = cameraDevices;
              if (!cameras.length) {
                cameras = (await Html5Qrcode.getCameras()) || [];
                setCameraDevices(cameras);
              }
              if (!cameras.length) {
                throw new Error(
                  "No cameras were detected on this device. Try another device."
                );
              }
              let cameraId = preferredCameraId || selectedCameraId;
              if (!cameraId || !cameras.some((camera) => camera.id === cameraId)) {
                const rearCamera =
                  cameras.find((camera) =>
                    /back|rear|environment/i.test(camera.label || "")
                  ) || cameras[0];
                cameraId = rearCamera.id;
              }
              setSelectedCameraId(cameraId);

              let activeScanner = scannerRef.current;
              if (!activeScanner) {
                activeScanner = new Html5Qrcode("qr-reader", {
                  experimentalFeatures: { useBarCodeDetectorIfSupported: true },
                });
                scannerRef.current = activeScanner;
              } else {
                try {
                  await activeScanner.stop();
                } catch {
                  // ignore stop errors while switching cameras
                }
              }

              await activeScanner.start(
                { deviceId: { exact: cameraId } },
                qrConfig,
                handleScanSuccess,
                () => {}
              );
              setCameraError("");
            } catch (error) {
              console.error("Failed to start QR scanning", error);
              let message =
                error?.message ||
                "Unable to access the camera. Please grant permission and try again.";
              if (error?.name === "NotAllowedError") {
                message =
                  "Camera permission was blocked. Please allow access from your browser settings and try again.";
              } else if (error?.name === "NotFoundError") {
                message =
                  "No usable camera was found on this device. Try connecting a camera or using a different device.";
              }
              setCameraError(message);
              setScanning(false);
              await cleanupScanner();
            } finally {
              setInitialisingCamera(false);
            }
          },
          [
            cameraDevices,
            cleanupScanner,
            handleScanSuccess,
            qrConfig,
            requestCameraPermission,
            selectedCameraId,
          ]
        );

        const handleCameraChange = useCallback(
          (event) => {
            const newCameraId = event.target.value;
            setSelectedCameraId(newCameraId);
            if (scanning) {
              startScan(newCameraId);
            }
          },
          [scanning, startScan]
        );

        return (
          <div>
            <section className="hero">
              <div className="container">
                <h1>Instantly Notify Vehicle Owners</h1>
                <p>
                  Avahanaa lets you discreetly contact vehicle owners by scanning a

                {!scanning && (
                  <button
                    type="button"
                    className="btn btn-lg btn-primary mt-3"
                    onClick={() => startScan()}
                    disabled={initialisingCamera}
                  >
                    {initialisingCamera ? "Starting…" : "Scan QR"}
                  </button>
                )}
                {!scanning && cameraError && (
                  <div className="alert alert-warning mt-3" role="alert">
                    {cameraError}
                  </div>
                )}
              </div>
            </section>
            {scanning && (
              <section className="py-5 bg-light">
                <div className="container text-center">
                  <h2 className="mb-3">Scan the QR Code</h2>
                  <p className="text-muted small mb-4">
                    When prompted, allow camera access so we can read the Avahanaa QR code.

                  {cameraDevices.length > 1 && (
                    <div className="mb-3">
                      <label className="form-label" htmlFor="cameraSelect">
                        Choose camera
                      </label>
                      <select
                        id="cameraSelect"

                      >
                        {cameraDevices.map((camera, index) => (
                          <option key={camera.id} value={camera.id}>
                            {camera.label || `Camera ${index + 1}`}

                        ))}

                  )}
                  <div
                    id="qr-reader"
                    style={{ width: "300px", margin: "0 auto" }}
                  ></div>
                  {initialisingCamera && (
                    <p className="text-muted small mt-3">
                      Preparing camera… please allow access if prompted.
                    </p>

                  {cameraError && (

                  <div className="d-flex flex-column flex-md-row justify-content-center gap-2 mt-3">
