      /**
       * Notify page – main logic for reading the QR code and sending notifications
       */
      function NotifyPage() {
        const queryDefaults = useMemo(() => {
          const params = getCurrentRouteParams();
          const qrParam = (params.get("qr") || "").trim();
          const idParam = (params.get("id") || "").trim();
          const vehicleParam = (params.get("vehicle") || "").trim();
          const payloadParam = (params.get("payload") || "").trim();
          const details = {};
          ["carModel", "color", "licensePlate"].forEach((key) => {
            const value = params.get(key);
            if (typeof value === "string" && value.trim()) {
              details[key] =
                key === "licensePlate" ? normalisePlate(value) : value.trim();
            }
          });
          if (vehicleParam && !details.licensePlate) {
            details.licensePlate = normalisePlate(vehicleParam);
          }
          return {
            initialIdentifier: qrParam || idParam || vehicleParam || "",
            initialQr: qrParam || idParam || "",
            initialPayload: payloadParam,
            payloadVersion: (params.get("v") || "").trim(),
            directDetails: details,
          };
        }, []);
        const [identifier, setIdentifier] = useState(queryDefaults.initialIdentifier);
        const [identifierInput, setIdentifierInput] = useState(
          queryDefaults.initialIdentifier
        );
        const [user, setUser] = useState(null);
        const [ownerFromQr, setOwnerFromQr] = useState(null);
        const [loading, setLoading] = useState(false);
        const [error, setError] = useState("");
        const [reason, setReason] = useState("");
        const [message, setMessage] = useState("");
        const [contact, setContact] = useState("");
        const [shareContact, setShareContact] = useState(false);
        const [sent, setSent] = useState(false);
        const [statusHandle, setStatusHandle] = useState(null);
        const [ownerReply, setOwnerReply] = useState(null);
        const [waitedOut, setWaitedOut] = useState(false);
        const [sending, setSending] = useState(false);
        const [carDetails, setCarDetails] = useState(() => ({
          ...queryDefaults.directDetails,
        }));
        const [notifyTarget, setNotifyTarget] = useState({
          fcmToken: "",
          userId: "",
          vehicleId: "",
        });
        const [notifyFeedback, setNotifyFeedback] = useState({
          message: "",
          variant: "muted",
        });
        const initialQr = queryDefaults.initialQr;
        const initialPayload = queryDefaults.initialPayload;
        const initialPayloadVersion = queryDefaults.payloadVersion;
        const displayPlate = useMemo(() => {
          const plateValue =
            carDetails.licensePlate ||
            (user && (user.licensePlate || user.vehicleNumber)) ||
            "";
          return plateValue.trim();
        }, [carDetails.licensePlate, user]);
        const displayIdentifier = useMemo(
          () => identifier || initialQr || "",
          [identifier, initialQr]
        );
        const handleIdentifierResolve = useCallback(() => {
          const trimmed = identifierInput.trim();
          if (!trimmed) {
            return;
          }
          const normalisedEntry = normalisePlate(trimmed);
          setIdentifierInput(trimmed);
          setIdentifier(normalisedEntry);
          setCarDetails((prev) => ({
            ...prev,
            licensePlate: normalisedEntry,
          }));
          const params = getCurrentRouteParams();
          params.set("vehicle", normalisedEntry);
          params.delete("qr");
          params.delete("id");
          const basePath = parseShortNotifyRoute(window.location.pathname)
            ? "./index.html"
            : window.location.pathname;
          const nextQuery = params.toString();
          const nextUrl = nextQuery
            ? `${basePath}?${nextQuery}`
            : basePath;
          window.history.replaceState({}, "", nextUrl);
        }, [identifierInput]);

        useEffect(() => {
          let cancelled = false;
          async function decodePayload() {
            if (!initialPayload) {
              return;
            }
            try {
              const decoded = await decodeQrPayload(
                initialPayload,
                initialPayloadVersion
              );
              if (!decoded || cancelled) {
                return;
              }
              setCarDetails((prev) => {
                const next = { ...prev };
                ["carModel", "licensePlate", "color"].forEach((key) => {
                  const value = decoded[key];
                  if (typeof value === "string" && value.trim()) {
                    next[key] =
                      key === "licensePlate"
                        ? normalisePlate(value)
                        : value.trim();
                  }
                });
                return next;
              });
              const decodedToken =
                typeof decoded.fcmToken === "string"
                  ? decoded.fcmToken.trim()
                  : "";
              const decodedUserId =
                typeof decoded.userId === "string" ? decoded.userId.trim() : "";
              const decodedVehicleId =
                typeof decoded.vehicleId === "string"
                  ? decoded.vehicleId.trim()
                  : "";
              const decodedQrId =
                typeof decoded.qrCodeId === "string"
                  ? decoded.qrCodeId.trim()
                  : "";
              if (decodedToken || decodedUserId || decodedVehicleId) {
                setNotifyTarget((prev) => {
                  const next = { ...prev };
                  if (!next.fcmToken && decodedToken) {
                    next.fcmToken = decodedToken;
                  }
                  if (!next.userId && decodedUserId) {
                    next.userId = decodedUserId;
                  }
                  if (!next.vehicleId && decodedVehicleId) {
                    next.vehicleId = decodedVehicleId;
                  }
                  return next;
                });
              }
              if (decodedQrId) {
                setIdentifier((prev) => prev || decodedQrId);
              }
            } catch (payloadErr) {
              console.warn("Failed to decode QR payload", payloadErr);
            }
          }
          decodePayload();
          return () => {
            cancelled = true;
          };
        }, [initialPayload, initialPayloadVersion]);

        useEffect(() => {
          let cancelled = false;
          const hasLookupValue = Boolean(displayPlate || identifier);
          if (!hasLookupValue && !initialQr) {
            setUser(null);
            setLoading(false);
            if (!hasLookupValue) {
              setError("");
            }
            return () => {
              cancelled = true;
            };
          }
          async function resolveId() {
            setLoading(true);
            setError("");
            const searchOrder = [];
            if (displayPlate) {
              searchOrder.push(displayPlate);
            }
            if (identifier && identifier !== displayPlate) {
              searchOrder.push(identifier);
            }
            if (
              initialQr &&
              initialQr !== identifier &&
              initialQr !== displayPlate
            ) {
              searchOrder.push(initialQr);
            }
            let resolvedUser = null;
            for (const candidate of searchOrder) {
              try {
                resolvedUser = await fetchUserByIdOrPlate(candidate);
              } catch (lookupErr) {
                console.error("Failed to resolve owner record", lookupErr);
              }
              if (resolvedUser) {
                break;
              }
            }
            if (cancelled) {
              return;
            }
            if (!resolvedUser) {
              if (!initialQr) {
                setError(
                  "No owner record was found for this identifier. Please check the QR code or vehicle number and try again."
                );
              } else {
                setError("");
              }
              setNotifyTarget({
                fcmToken: "",
                userId: "",
                vehicleId: "",
              });
              setNotifyFeedback({ message: "", variant: "muted" });
              setUser(null);
              setLoading(false);
              return;
            }
            setUser(resolvedUser);
            setIdentifier((prev) => {
              const nextIdentifier =
                resolvedUser.qrCodeId ||
                resolvedUser.qrId ||
                resolvedUser.id ||
                resolvedUser.userId ||
                "";
              if (!nextIdentifier || nextIdentifier === prev) {
                return prev;
              }
              return nextIdentifier;
            });
            setError("");
            setLoading(false);
            setCarDetails((prev) => {
              const next = { ...prev };
              const plate =
                resolvedUser.licensePlate ||
                resolvedUser.vehicleNumber ||
                (resolvedUser.carDetails &&
                typeof resolvedUser.carDetails.licensePlate === "string"
                  ? resolvedUser.carDetails.licensePlate
                  : "");
              if (plate && typeof plate === "string") {
                next.licensePlate = normalisePlate(plate);
              }
              if (
                resolvedUser.carDetails &&
                typeof resolvedUser.carDetails === "object"
              ) {
                if (
                  typeof resolvedUser.carDetails.carModel === "string" &&
                  resolvedUser.carDetails.carModel.trim()
                ) {
                  next.carModel = resolvedUser.carDetails.carModel.trim();
                }
                if (
                  typeof resolvedUser.carDetails.color === "string" &&
                  resolvedUser.carDetails.color.trim()
                ) {
                  next.color = resolvedUser.carDetails.color.trim();
                }
              }
              return next;
            });
            const nextFcmToken =
              typeof resolvedUser.fcmToken === "string"
                ? resolvedUser.fcmToken.trim()
                : "";
            const nextUserId =
              resolvedUser.id || resolvedUser.userId || "";
            const nextVehicleId =
              typeof resolvedUser.vehicleId === "string"
                ? resolvedUser.vehicleId.trim()
                : "";
            setNotifyTarget({
              fcmToken: nextFcmToken,
              userId: nextUserId,
              vehicleId: nextVehicleId,
            });
            setNotifyFeedback({
              message: "Ready to alert the owner instantly.",
              variant: "muted",
            });
          }
          resolveId();
          return () => {
            cancelled = true;
          };
        }, [displayPlate, identifier, initialQr]);

        useEffect(() => {
          let cancelled = false;
          if (!initialQr) {
            setOwnerFromQr(null);
            if (!identifier) {
              setNotifyFeedback({
                message:
                  "Notifications are available only when you scan a registered Avahanaa QR code.",
                variant: "muted",
              });
              setNotifyTarget({
                fcmToken: "",
                userId: "",
                vehicleId: "",
              });
            }
            return () => {
              cancelled = true;
            };
          }
          if (!functionsClient) {
            setOwnerFromQr(null);
            setNotifyTarget({
              fcmToken: "",
              userId: "",
              vehicleId: "",
            });
            setNotifyFeedback({
              message:
                "Notifications service is unavailable right now. Please try again later.",
              variant: "danger",
            });
            return () => {
              cancelled = true;
            };
          }
          if (!db) {
            setOwnerFromQr(null);
            setNotifyTarget({
              fcmToken: "",
              userId: "",
              vehicleId: "",
            });
            setNotifyFeedback({
              message:
                "We could not connect to the owner directory right now. Please try again shortly.",
              variant: "danger",
            });
            return () => {
              cancelled = true;
            };
          }
          setNotifyFeedback({
            message: "Fetching owner profile...",
            variant: "info",
          });
          async function hydrateFromQr() {
            try {
              const owner = await fetchOwnerByQr(initialQr);
              if (cancelled) {
                return;
              }
              if (!owner) {
                setOwnerFromQr(null);
                if (!user) {
                  setError(
                    "This QR code is not yet linked to an owner profile. Ask them to open the Avahanaa app."
                  );
                } else {
                  setError("");
                }
                setNotifyTarget({
                  fcmToken: "",
                  userId: "",
                  vehicleId: "",
                });
                setNotifyFeedback({
                  message: NOT_ACTIVE_MESSAGE,
                  variant: "warning",
                });
                return;
              }
              setOwnerFromQr(owner);
              setError("");
              if (!owner.isActive) {
                setNotifyTarget({
                  fcmToken: "",
                  userId: owner.userId || "",
                  vehicleId: owner.vehicleId || "",
                });
                setNotifyFeedback({
                  message: "This QR code is currently inactive for notifications.",
                  variant: "warning",
                });
                return;
              }
              if (owner.carDetails && typeof owner.carDetails === "object") {
                setCarDetails((prev) => {
                  const next = { ...prev };
                  ["carModel", "licensePlate", "color"].forEach((key) => {
                    const value = owner.carDetails[key];
                    if (typeof value === "string" && value.trim()) {
                      next[key] =
                        key === "licensePlate"
                          ? normalisePlate(value)
                          : value.trim();
                    }
                  });
                  return next;
                });
              }
              setNotifyTarget({
                fcmToken: owner.fcmToken,
                userId: owner.userId || "",
                vehicleId: owner.vehicleId || "",
              });
              setNotifyFeedback({
                message: "Ready to alert the owner instantly.",
                variant: "muted",
              });
            } catch (qrErr) {
              if (!cancelled) {
                console.error(
                  "Failed to load owner data for QR id",
                  initialQr,
                  qrErr
                );
                setNotifyFeedback({
                  message:
                    "Notifications service is unavailable right now. Please try again later.",
                  variant: "danger",
                });
              }
            }
          }
          hydrateFromQr();
          return () => {
            cancelled = true;
          };
        }, [initialQr, user, identifier]);

        useEffect(() => {
          if (user || !ownerFromQr) {
            return;
          }
          setUser({
            id: ownerFromQr.userId || "",
            userId: ownerFromQr.userId || "",
            vehicleId: ownerFromQr.vehicleId || "",
            qrCodeId: initialQr || "",
            carDetails: ownerFromQr.carDetails || {},
            fcmToken: ownerFromQr.fcmToken || "",
            licensePlate:
              ownerFromQr.carDetails &&
              typeof ownerFromQr.carDetails.licensePlate === "string"
                ? normalisePlate(ownerFromQr.carDetails.licensePlate)
                : "",
          });
          setError("");
        }, [user, ownerFromQr, initialQr]);

        const reasonCodeMap = {
          "Your vehicle is blocking my way": "blocking_driveway",
          "Your headlights/hazards are on": "other",
          "Your car alarm is ringing": "other",
          "There is a pet inside, please check": "other",
          "It’s urgent – please contact me": "emergency",
          "Other (I’ll type a quick note)": "other",
        };

        // Wait for the owner to answer.
        //
        // Polled rather than streamed on purpose: the Firestore rules refuse
        // this page outright, which is what stopped it reading the owner's
        // record, so there is no listener to attach. `/api/status` answers with
        // the reply and nothing else.
        //
        // Four seconds is slow enough to be cheap and fast enough that the
        // answer feels immediate to someone staring at the screen. It stops on
        // the first reply, and gives up after ten minutes — past that the
        // person has walked away, and a page left polling in a backgrounded tab
        // is just battery.
        useEffect(() => {
          if (!statusHandle || ownerReply) return undefined;

          let cancelled = false;
          let timer = null;
          const startedAt = Date.now();
          const GIVE_UP_AFTER_MS = 10 * 60 * 1000;

          async function check() {
            if (cancelled) return;

            if (Date.now() - startedAt > GIVE_UP_AFTER_MS) {
              setWaitedOut(true);
              return;
            }

            try {
              const data = await apiGet(
                `/api/status?id=${encodeURIComponent(statusHandle.id)}` +
                  `&t=${encodeURIComponent(statusHandle.token)}`
              );
              if (cancelled) return;
              if (data && data.acknowledged && data.reply) {
                setOwnerReply(data.reply);
                return;
              }
            } catch (error) {
              // A failed poll is not worth showing anyone. The alert is
              // already delivered and recorded; this is only the reply.
              console.debug("status poll failed", error);
            }

            if (!cancelled) timer = setTimeout(check, 4000);
          }

          timer = setTimeout(check, 2500);
          return () => {
            cancelled = true;
            if (timer) clearTimeout(timer);
          };
        }, [statusHandle, ownerReply]);

        // Counts the ETA down while the page is open.
        //
        // A fixed "about 5 minutes" is stale the moment it is read. Someone
        // standing in the road wants to know how much longer, and a number
        // that moves is the difference between waiting and giving up. The
        // clock ticks from the moment the owner actually replied, not from
        // when this page happened to notice.
        const [etaLeft, setEtaLeft] = useState(null);

        useEffect(() => {
          if (!ownerReply || !ownerReply.onTheWay || !ownerReply.etaMinutes) {
            setEtaLeft(null);
            return undefined;
          }

          const dueAt =
            new Date(ownerReply.at).getTime() + ownerReply.etaMinutes * 60000;

          const tick = () => {
            // Floors at zero and stays there. Counting into negative numbers
            // would turn a reassurance into an accusation.
            setEtaLeft(Math.max(0, Math.round((dueAt - Date.now()) / 1000)));
          };
          tick();
          const id = setInterval(tick, 1000);
          return () => clearInterval(id);
        }, [ownerReply]);

        async function handleSubmit(e) {
          e.preventDefault();
          if (sending) return;
          // No token, no userId, no vehicleId assembled here any more. The
          // server derives all three from the QR id, which is the only thing
          // it now trusts from this page.
          const targetQrId =
            initialQr || (user && (user.qrCodeId || user.qrId)) || identifier;
          if (!targetQrId) {
            setNotifyFeedback({
              message:
                "We could not confirm the QR reference for this vehicle. Please refresh the page or rescan the Avahanaa QR code.",
              variant: "warning",
            });
            return;
          }
          const reasonCode = reasonCodeMap[reason] || "other";
          const userPlate =
            carDetails.licensePlate ||
            (user && (user.licensePlate || user.vehicleNumber)) ||
            "";
          const title = userPlate
            ? `Vehicle Alert – ${userPlate}`
            : "Vehicle Alert";
          const baseMessage = message?.trim()
            ? message.trim()
            : reason
            ? `A visitor has selected the reason: ${reason}.`
            : "A visitor is requesting your attention regarding your vehicle.";
          const trimmedContact = contact?.trim();
          const bodyMsg =
            shareContact && trimmedContact
              ? `${baseMessage} Contact: ${trimmedContact}`
              : baseMessage;
          setSending(true);
          setError("");
          setNotifyFeedback({
            message: "Sending notification...",
            variant: "info",
          });
          const metadata = {
            reason: reasonCode,
            reasonLabel: reason || "",
            message: bodyMsg,
            identifier: identifier || initialQr || "",
          };
          if (shareContact && trimmedContact) {
            metadata.contact = trimmedContact;
          }
          if (userPlate) {
            metadata.licensePlate = userPlate;
          }
          if (carDetails.carModel) {
            metadata.carModel = carDetails.carModel;
          } else if (
            user &&
            user.carDetails &&
            typeof user.carDetails.carModel === "string" &&
            user.carDetails.carModel.trim()
          ) {
            metadata.carModel = user.carDetails.carModel.trim();
          }
          if (carDetails.color) {
            metadata.color = carDetails.color;
          } else if (
            user &&
            user.carDetails &&
            typeof user.carDetails.color === "string" &&
            user.carDetails.color.trim()
          ) {
            metadata.color = user.carDetails.color.trim();
          }
          try {
            // Awaited before the send, not alongside it. The alert must
            // carry the location or nothing, and `captureScanLocation` is
            // already hard-bounded at six seconds — so the worst case is an
            // alert that leaves six seconds late, and the common case (a
            // cached fix, or a browser that refuses instantly) is no delay at
            // all.
            const scanLocation = await captureScanLocation();

            const result = await triggerNotifyFunction({
              qrCodeId: targetQrId,
              reason: reasonCode,
              message: bodyMsg,
              location: scanLocation,
            });
            if (result.ok) {
              setNotifyFeedback({
                message:
                  "Notification sent successfully to the owner's device.",
                variant: "success",
              });
              if (result.notificationId && result.statusToken) {
                setStatusHandle({
                  id: result.notificationId,
                  token: result.statusToken,
                });
              }
              setSent(true);
            } else {
              const failureMessage =
                result.message || "Failed to send notification.";
              setNotifyFeedback({
                message: failureMessage,
                variant: "danger",
              });
            }
          } catch (err) {
            console.error("Failed to send notification", err);
            setNotifyFeedback({
              message: err?.message || "Failed to send notification.",
              variant: "danger",
            });
          } finally {
            setSending(false);
          }
        }
        if (!identifier) {
          return (
            <div className="container py-5">
              <h2>Notify Vehicle Owner</h2>
              <p>Please enter the <strong>vehicle number</strong> or the QR identifier to proceed.</p>
              <div className="mb-3 row g-2">
                <div className="col-auto flex-grow-1">
                  <input
                    type="text"
                    className="form-control"
                    placeholder="Vehicle number or QR ID"
                    value={identifierInput}
                    onChange={(e) => setIdentifierInput(e.target.value)}
                    onKeyDown={(e) => {
                      if (e.key === "Enter") {
                        e.preventDefault();
                        handleIdentifierResolve();
                      }
                    }}
                  />
                </div>
                <div className="col-auto">
                  <button
                    type="button"
                    className="btn btn-primary"
                    onClick={handleIdentifierResolve}
                    disabled={!identifierInput.trim()}
                  >
                    Resolve
                  </button>
                </div>
              </div>
            </div>
          );
        }
        if (loading) {
          return (
            <div className="container py-5 text-center">
              <div className="spinner-border text-primary" role="status"></div>
              <p className="mt-3">Resolving vehicle…</p>
            </div>
          );
        }
        if (error) {
          return (
            <div className="container py-5">
              <div className="alert alert-danger">{error}</div>
              <a href="./index.html?page=notify" className="btn btn-secondary">
                Try Again
              </a>
            </div>
          );
        }
        if (sent) {
          // This screen is the point of the product.
          //
          // Someone is standing next to a stranger's car, annoyed, deciding
          // how annoyed to be. "Sent successfully" — which is all this used to
          // say — answers a question they did not ask. What they want to know
          // is whether anybody is actually coming, and the moment they can see
          // that, the situation defuses itself. So the page waits with them.
          const onTheWay = ownerReply && ownerReply.onTheWay;

          return (
            <div className="container py-5">
              <div className="row justify-content-center">
                <div className="col-12 col-md-8 col-lg-6">
                  <div className="card shadow-sm border-0">
                    <div className="card-body text-center p-4 p-md-5">
                      {ownerReply ? (
                        <>
                          <div
                            className={`display-4 mb-3 ${
                              onTheWay ? "text-success" : "text-warning"
                            }`}
                            aria-hidden="true"
                          >
                            {onTheWay ? "\u{1F697}" : "\u{1F440}"}
                          </div>
                          <h2 className="h4 mb-3">{ownerReply.label}</h2>
                          {onTheWay && etaLeft !== null && (
                            <div className="mb-3" aria-live="polite">
                              <div className="display-6 fw-semibold text-success">
                                {etaLeft > 0
                                  ? `${Math.floor(etaLeft / 60)}:${String(
                                      etaLeft % 60
                                    ).padStart(2, "0")}`
                                  : "Any moment"}
                              </div>
                              <div className="small text-muted">
                                {etaLeft > 0
                                  ? "estimated time until they arrive"
                                  : "they should be arriving now"}
                              </div>
                            </div>
                          )}
                          <p className="text-muted mb-4">
                            {onTheWay
                              ? "Thanks for letting them know \u2014 you can wait or head off, whichever suits you."
                              : "They have seen your message. Thanks for taking the trouble to send it."}
                          </p>
                        </>
                      ) : waitedOut ? (
                        <>
                          <div className="display-4 mb-3 text-success" aria-hidden="true">
                            {"\u2714\uFE0F"}
                          </div>
                          <h2 className="h4 mb-3">The owner has been alerted</h2>
                          <p className="text-muted mb-4">
                            They have not replied yet, but the alert reached their
                            phone and it keeps reminding them until they open it.
                            Thanks for taking the trouble to send it.
                          </p>
                        </>
                      ) : (
                        <>
                          <div className="display-4 mb-3 text-success" aria-hidden="true">
                            {"\u2714\uFE0F"}
                          </div>
                          <h2 className="h4 mb-3">The owner has been alerted</h2>
                          <p className="text-muted mb-2">
                            Their phone is ringing now. Hang on a moment and this
                            page will tell you when they answer.
                          </p>
                          <div
                            className="d-flex align-items-center justify-content-center gap-2 text-muted mb-4"
                            role="status"
                            aria-live="polite"
                          >
                            <span
                              className="spinner-border spinner-border-sm"
                              aria-hidden="true"
                            ></span>
                            <span className="small">Waiting for a reply…</span>
                          </div>
                        </>
                      )}

                      <p className="small text-muted mb-4">
                        Your details were never shared with the owner, and theirs
                        were never shared with you.
                      </p>
                      <a href="./index.html" className="btn btn-outline-secondary">
                        Done
                      </a>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          );
        }
        const canRenderForm = user || ownerFromQr || identifier || initialQr;
        if (!canRenderForm) {
          return null;
        }
        const canNotify = Boolean(
          initialQr || identifier || (user && (user.qrCodeId || user.qrId))
        );
        const feedbackVariantClass = {
          success: "text-success",
          danger: "text-danger",
          warning: "text-warning",
          info: "text-info",
          muted: "text-muted",
        };
        const feedbackClass =
          feedbackVariantClass[notifyFeedback.variant] || "text-muted";
        // Reasons with icons for a more engaging UI
        const reasonOptions = [
          { label: "Your vehicle is blocking my way", icon: "bi-exclamation-triangle-fill" },
          { label: "Your headlights/hazards are on", icon: "bi-lightbulb-fill" },
          { label: "Your car alarm is ringing", icon: "bi-bell-fill" },
          { label: "There is a pet inside, please check", icon: "bi-heart-fill" },
          { label: "It’s urgent – please contact me", icon: "bi-telephone-fill" },
          { label: "Other (I’ll type a quick note)", icon: "bi-pencil-fill" },
        ];
        return (
          <div className="container py-5">
            <div className="row g-4">
              <div className="col-12 col-lg-8">
                <div className="card shadow-sm mb-4">
                <div className="card-body">
                    <h5 className="card-title mb-3">Sending a note to the owner</h5>
                    <p className="mb-0">
                      {displayPlate ? (
                        <span>Vehicle number: <strong>{displayPlate}</strong></span>
                      ) : (
                        <span>Identifier: <strong>{displayIdentifier}</strong></span>
                      )}
                    </p>
                    <p className="text-muted mb-0">
                      Choose a reason and optionally leave a short note or share your
                      contact. Your message will be sent instantly to the owner’s
                      app.
                    </p>
                  </div>
                </div>
                <div className="card shadow-sm">
                  <div className="card-body">
                    <form onSubmit={handleSubmit}>
                      <div className="mb-3">
                        <label className="form-label fw-semibold">Reason</label>
                        <div className="row g-2 reason-buttons">
                          {reasonOptions.map((opt) => (
                            <div className="col-12 col-md-6" key={opt.label}>
                              <button
                                type="button"
                                className={`btn ${reason === opt.label ? "active" : ""} w-100`}
                                onClick={() => setReason(opt.label)}
                              >
                                <i className={`bi ${opt.icon}`}></i>
                                {opt.label}
                              </button>
                            </div>
                          ))}
                        </div>
                      </div>
                      {reason === "Other (I’ll type a quick note)" && (
                        <div className="mb-3">
                          <label className="form-label">Quick note</label>
                          <textarea
                            className="form-control"
                            rows="3"
                            value={message}
                            onChange={(e) => setMessage(e.target.value)}
                            placeholder="Type your message here..."
                          ></textarea>
                        </div>
                      )}
                      {reason !== "Other (I’ll type a quick note)" && (
                        <div className="mb-3">
                          <label className="form-label">Optional note</label>
                          <textarea
                            className="form-control"
                            rows="3"
                            value={message}
                            onChange={(e) => setMessage(e.target.value)}
                            placeholder="Add quick context..."
                          ></textarea>
                        </div>
                      )}
                      <div className="form-check form-switch mb-3">
                        <input
                          className="form-check-input"
                          type="checkbox"
                          id="shareContactToggle"
                          checked={shareContact}
                          onChange={(e) => {
                            setShareContact(e.target.checked);
                            if (!e.target.checked) {
                              setContact("");
                            }
                          }}
                        />
                        <label className="form-check-label" htmlFor="shareContactToggle">
                          Share my contact (optional)
                        </label>
                      </div>
                      {shareContact && (
                        <div className="mb-3">
                          <label className="form-label">Your contact</label>
                          <input
                            type="text"
                            className="form-control"
                            placeholder="Your phone or email"
                            value={contact}
                            onChange={(e) => setContact(e.target.value)}
                          />
                          <div className="form-text">
                            Your contact details will be shared with the owner
                            only if you provide them.
                          </div>
                        </div>
                      )}
                      {/*
                        Primary, not success. Green in this product means
                        "confirmed" — the owner is on their way, the QR is
                        active — and a green button here reads as though the
                        thing has already happened. This is the one action the
                        whole page exists for, so it takes the strongest
                        treatment the design system has.
                      */}
                      <button
                        id="notifyOwnerBtn"
                        type="submit"
                        className="btn btn-primary btn-lg w-100 mt-2"
                        disabled={sending || !reason || !canNotify}
                      >
                        {sending ? "Sending…" : "Notify Owner Now"}
                      </button>
                      {/*
                        Say why it is disabled. Somebody standing in the road
                        pressing a dead button has no way to know a reason is
                        required, and the reason grid is far enough above that
                        the connection is not obvious.
                      */}
                      {!reason && canNotify && !sending && (
                        <p className="text-muted small text-center mt-2 mb-0">
                          Pick a reason above to send.
                        </p>
                      )}
                      {notifyFeedback.message && (
                        <p
                          id="notifyOwnerFeedback"
                          className={`small mt-2 ${feedbackClass}`}
                        >
                          {notifyFeedback.message}
                        </p>
                      )}
                    </form>
                  </div>
                </div>
              </div>
              <div className="col-12 col-lg-4">
                <div className="card shadow-sm h-100">
                  <div className="card-body">
                    <h5>How it Works</h5>
                    <ol className="small ps-3 mb-0">
                      <li className="mb-2">
                        Scan the QR code – it encodes a secure token.
                      </li>
                      <li className="mb-2">
                        Pick a reason and add a short note. Optionally share
                        your contact.
                      </li>
                      <li className="mb-2">
                        We send your message instantly via a secure push
                        notification to the owner’s device.
                      </li>
                      <li className="mb-0">
                        The owner taps to view and respond. Your contact
                        details are shared only if you opted in.
                      </li>
                    </ol>
                  </div>
                </div>
              </div>
            </div>
          </div>
        );
      }

      /**
       * Main App component which selects the page based on URL.
       */
      function App() {
        const page = getCurrentRouteParams().get("page");
        let Component;
        switch (page) {
          case "contact":
            Component = ContactPage;
            break;
          case "notify":
            Component = NotifyPage;
            break;
          case "about":
            Component = AboutPage;
            break;
          default:
            Component = HomePage;
        }
        return (
          <div>
            <Navbar />
            <Component />
            <Footer />
          </div>
        );
      }

      // Use React 18 concurrent root API
      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>

    <!-- Bootstrap JS (for collapse nav etc.) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
