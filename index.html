    <meta name="theme-color" content="#1a1e24" />
    <meta property="og:title" content="Avahanaa – Quick Vehicle Notifications" />
    <meta property="og:description" content="Reach a vehicle owner in seconds by scanning the sticker on their windscreen. No app, no phone number, nothing shared either way." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/logo.jpg" />
    <!-- Favicon -->

    <!--
      Type. Plus Jakarta Sans for display, Inter for body and anything dense,
      Noto Sans Kannada so the Kannada UI renders identically on every device
      rather than falling to whatever the phone happens to have. These are the
      three families `lib/theme/app_theme.dart` names, so the sticker, the app
      and this page are set in the same faces.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Noto+Sans+Kannada:wght@400;500;600;700&display=swap"
    />
    <!-- The Avahanaa design system. Shared with the legal pages. -->
    <link rel="stylesheet" href="/theme.css" />
    <script>
      /*
       * Theme, applied before the first paint.
       *
       * Deliberately inline and synchronous rather than part of the React
       * bundle below: React here is transpiled in the browser by Babel, which
       * means the app mounts a few hundred milliseconds in. Waiting for it to
       * set the theme would show every dark-mode user a white flash on a page
       * they most often open outdoors at night.
       *
       * `system` writes no attribute at all, leaving the media query in
       * theme.css in charge — an explicit `light`/`dark` overrides it.
       */
      (function () {
        try {
          var stored = localStorage.getItem("avahanaa.theme");
          if (stored === "light" || stored === "dark") {
            document.documentElement.setAttribute("data-theme", stored);
          }
          var lang = localStorage.getItem("avahanaa.lang");
          if (lang === "kn" || lang === "en") {
            document.documentElement.setAttribute("lang", lang);
          }
        } catch (e) {
          /* Private mode, or storage disabled. The defaults are correct. */
        }
      })();
    </script>

  <body>

    <!-- QR code scanner library -->
    <script src="https://unpkg.com/html5-qrcode" ></script>
    <!-- React and ReactDOM via CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <!-- Babel for JSX transpiling -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
      // Avahanaa – Vehicle Notification Frontend
      //
      // One React bundle serving every page: Home, Features, Plans, Notify,
      // About and Contact, selected by `?page=`. QR codes are read with the
      // device camera or resolved from the URL, and every lookup and send goes
      // through `/api/*` — this page never touches Firestore for anything to
      // do with an owner. See the data-access note further down for why.

      const { useState, useEffect, useMemo, useRef, useCallback } = React;

      const QR_ENCRYPTION_DEFAULT_KEY = "0123456789abcdef0123456789abcdef";
      const QR_ENCRYPTION_DEFAULT_IV = "abcdef9876543210";
      const qrTextEncoder = new TextEncoder();
      const qrTextDecoder = new TextDecoder();
      const qrSubtleCrypto =
        (window.crypto && (window.crypto.subtle || window.crypto.webkitSubtle)) ||
        null;

      function getQrEncryptionConfig() {
        const overrideKey =
          (window.QR_ENCRYPTION_KEY || window.__QR_ENCRYPTION_KEY || "").trim();
        const overrideIv =
          (window.QR_ENCRYPTION_IV || window.__QR_ENCRYPTION_IV || "").trim();
        return {
          key: overrideKey || QR_ENCRYPTION_DEFAULT_KEY,
          iv: overrideIv || QR_ENCRYPTION_DEFAULT_IV,
        };
      }

      function applyPkcs7Padding(bytes) {
        const blockSize = 16;
        const remainder = bytes.length % blockSize;
        const pad = remainder === 0 ? blockSize : blockSize - remainder;
        const padded = new Uint8Array(bytes.length + pad);
        padded.set(bytes);
        for (let i = bytes.length; i < padded.length; i += 1) {
          padded[i] = pad;
        }
        return padded;
      }

      function bytesToBase64(bytes) {
        let binary = "";
        const len = bytes.length;
        for (let i = 0; i < len; i += 1) {
          binary += String.fromCharCode(bytes[i]);
        }
        return btoa(binary);
      }

      function base64ToBytes(value) {
        const cleaned = (value || "").replace(/\s+/g, "");
        if (!cleaned) return new Uint8Array();
        const normalised = cleaned.replace(/-/g, "+").replace(/_/g, "/");
        const padding = (4 - (normalised.length % 4 || 4)) % 4;
        const padded = normalised + "=".repeat(padding);
        const binary = atob(padded);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i += 1) {
          bytes[i] = binary.charCodeAt(i);
        }
        return bytes;
      }

      function removePkcs7Padding(bytes) {
        if (!bytes.length) {
          return bytes;
        }
        const pad = bytes[bytes.length - 1];
        if (pad < 1 || pad > 16) {
          throw new Error("Invalid padding detected");
        }
        for (let i = bytes.length - pad; i < bytes.length; i += 1) {
          if (bytes[i] !== pad) {
            throw new Error("Invalid padding detected");
          }
        }
        return bytes.slice(0, bytes.length - pad);
      }

      const shortNotifyRoutePrefixes = new Set(["n", "notify"]);

      function parseShortNotifyRoute(pathname = window.location.pathname) {
        const cleanPath = String(pathname || "")
          .split("?")[0]
          .split("#")[0]
          .trim();
        if (!cleanPath) {
          return null;
        }
        const segments = cleanPath.split("/").filter(Boolean);
        if (segments.length < 2) {
          return null;
        }
        const prefix = segments[0].toLowerCase();
        if (!shortNotifyRoutePrefixes.has(prefix)) {
          return null;
        }
        const qrId = decodeURIComponent(segments[1] || "").trim();
        if (!qrId) {
          return null;
        }
        return { page: "notify", qrId };
      }

      function getCurrentRouteParams() {
        const params = new URLSearchParams(window.location.search);
        const shortRoute = parseShortNotifyRoute(window.location.pathname);
        if (shortRoute) {
          if (!params.has("page")) {
            params.set("page", shortRoute.page);
          }
          if (!params.has("qr")) {
            params.set("qr", shortRoute.qrId);
          }
        }
        return params;
      }

      async function decodeQrPayload(payload, versionHint = "") {
        if (!payload) {
          return null;
        }
        if (!qrSubtleCrypto) {
          throw new Error("Web Crypto API is unavailable in this browser.");
        }
        const encryptedBytes = base64ToBytes(payload);
        if (!encryptedBytes.length) {
          return null;
        }
        const { key, iv } = getQrEncryptionConfig();
        const keyBytes = qrTextEncoder.encode(key);
        if (![16, 24, 32].includes(keyBytes.length)) {
          throw new Error("QR encryption key must be 16, 24, or 32 bytes.");
        }
        const ivBytes = qrTextEncoder.encode(iv);
        if (ivBytes.length !== 16) {
          throw new Error("QR encryption IV must be 16 bytes.");
        }
        const cryptoKey = await qrSubtleCrypto.importKey(
          "raw",
          keyBytes,
          { name: "AES-CBC" },
          false,
          ["decrypt"]
        );
        const decryptedBuffer = await qrSubtleCrypto.decrypt(
          { name: "AES-CBC", iv: ivBytes },
          cryptoKey,
          encryptedBytes
        );
        const plainBytes = removePkcs7Padding(new Uint8Array(decryptedBuffer));
        const jsonString = qrTextDecoder.decode(plainBytes);
        const parsed = JSON.parse(jsonString);
        if (!parsed || typeof parsed !== "object") {
          return null;
        }
        const result = {};
        const toTrimmedString = (value) => {
          if (value == null) return "";
          if (typeof value === "string") return value.trim();
          if (typeof value === "number" || typeof value === "boolean") {
            return String(value).trim();
          }
          return "";
        };
        const resolvedVersion =
          toTrimmedString(versionHint) ||
          toTrimmedString(parsed.version) ||
          toTrimmedString(parsed.payloadVersion);
        const vehicleDetails =
          parsed.vehicle && typeof parsed.vehicle === "object"
            ? parsed.vehicle
            : {};
        const carDetailSource =
          Object.keys(vehicleDetails).length
            ? vehicleDetails
            : parsed.carDetails && typeof parsed.carDetails === "object"
            ? parsed.carDetails
            : parsed;
        const cleanCarDetails = {};
        ["color", "carModel", "licensePlate"].forEach((keyName) => {
          const value = carDetailSource[keyName];
          const trimmed = toTrimmedString(value);
          if (trimmed) {
            cleanCarDetails[keyName] =
              keyName === "licensePlate" ? normalisePlate(trimmed) : trimmed;
          }
        });
        if (Object.keys(cleanCarDetails).length) {
          result.carDetails = cleanCarDetails;
          Object.assign(result, cleanCarDetails);
        }
        // Deliberately NOT carried over: `parsed.fcmToken`.
        //
        // The v1/v2 encrypted stickers embedded the owner's FCM token in the
        // QR itself, which means it is printed on the windshield of every one
        // of those vehicles. It is dropped on decode, and `/api/notify` would
        // ignore it regardless — the server resolves the token from the QR id
        // using its own credentials and accepts none from the client.
        //
        // Those stickers cannot be recalled, so this is not a fix, only a
        // containment: the token stays valid until the owner's app rotates it.
        // See DEPLOY.md, "Legacy encrypted stickers".
        const userId = toTrimmedString(
          parsed.userId ||
            (parsed.metadata &&
            typeof parsed.metadata === "object"
              ? parsed.metadata.userId
              : "")
        );
        if (userId) {
          result.userId = userId;
        }
        const vehicleId = toTrimmedString(
          parsed.vehicleId ||
            (vehicleDetails && typeof vehicleDetails.id === "string"
              ? vehicleDetails.id
              : "") ||
            (parsed.metadata &&
            typeof parsed.metadata === "object"
              ? parsed.metadata.vehicleId
              : "")
        );
        if (vehicleId) {
          result.vehicleId = vehicleId;
        }
        const qrCodeId = toTrimmedString(
          parsed.qrCodeId ||
            parsed.qrId ||
            (parsed.metadata &&
            typeof parsed.metadata === "object"
              ? parsed.metadata.qrCodeId
              : "")
        );
        if (qrCodeId) {
          result.qrCodeId = qrCodeId;
        }
        if (parsed.contact && typeof parsed.contact === "object") {
          const contact = {};
          const email = toTrimmedString(parsed.contact.email);
          if (email) {
            contact.email = email;
          }
          const phoneNumber = toTrimmedString(
            parsed.contact.phoneNumber || parsed.contact.phone
          );
          if (phoneNumber) {
            contact.phoneNumber = phoneNumber;
          }
          if (Object.keys(contact).length) {
            result.contact = contact;
          }
        }
        const versionValue =
          resolvedVersion || (Object.keys(cleanCarDetails).length ? "1" : "");
        if (versionValue) {
          result.version = versionValue;
        }
        return Object.keys(result).length ? result : null;
      }

      function normalisePlate(value) {
        if (!value) return "";
        return value.trim().toUpperCase();
      }

      function canonicalisePlate(value) {
        if (!value) return "";
        return normalisePlate(value).replace(/[^A-Z0-9]/g, "");
      }

      async function encryptQrPayload(details) {
        if (!qrSubtleCrypto) {
          throw new Error("Web Crypto API is unavailable in this browser.");
        }
        const serialised = JSON.stringify(details);
        const payloadBytes = qrTextEncoder.encode(serialised);
        const paddedBytes = applyPkcs7Padding(payloadBytes);
        const { key, iv } = getQrEncryptionConfig();
        const keyBytes = qrTextEncoder.encode(key);
        if (![16, 24, 32].includes(keyBytes.length)) {
          throw new Error("QR encryption key must be 16, 24, or 32 bytes.");
        }
        const ivBytes = qrTextEncoder.encode(iv);
        if (ivBytes.length !== 16) {
          throw new Error("QR encryption IV must be 16 bytes.");
        }
        const cryptoKey = await qrSubtleCrypto.importKey(
          "raw",
          keyBytes,
          { name: "AES-CBC" },
          false,
          ["encrypt"]
        );
        const encryptedBuffer = await qrSubtleCrypto.encrypt(
          { name: "AES-CBC", iv: ivBytes },
          cryptoKey,
          paddedBytes
        );
        return bytesToBase64(new Uint8Array(encryptedBuffer));
      }

      // Firebase configuration (replace with your own values)
      const firebaseConfig = {
        apiKey: "AIzaSyDVB09QVh9YizQ7p1YXGcQWQ_43NV6f0SE",
        authDomain: "congestion-free.web.app",
        projectId: "congestion-free",
        storageBucket: "congestion-free.firebasestorage.app",
        messagingSenderId: "76007537447",
        appId: "1:76007537447:web:57a848570f39091b5a4702",
        measurementId: "G-5PNGPJZL6D",
      };

      // Initialize Firebase using the compat SDK
      let db = null;
      let functionsClient = null;
      try {
        if (firebase.apps.length === 0) {
          firebase.initializeApp(firebaseConfig);
        }
        db = firebase.firestore();
        functionsClient = firebase.functions();
        if (typeof firebase.analytics === "function") {
          try {
            firebase.analytics();
          } catch (analyticsErr) {
            console.warn("Firebase analytics initialisation failed:", analyticsErr);
          }
        }
      } catch (initErr) {
        console.error("Firebase initialization failed:", initErr);
      }

      /**
       * Utility to parse query parameters
       */
      function getQueryParam(name) {
        const params = getCurrentRouteParams();
        return params.get(name);
      }

      /**
       * ---------------------------------------------------------------
       * Data access
       * ---------------------------------------------------------------
       *
       * Everything below talks to the backend over /api/*. None of it touches
       * Firestore.
       *
       * That is the whole point. The previous version of this file resolved a
       * scan by reading `qrCodes/{id}`, then `users/{userId}`, then that
       * user's `vehicles` subcollection — from the browser of a stranger who
       * had just walked up to somebody's car. It pulled `fcmToken` and
       * `phoneNumber` into the page and handed the token back to the server to
       * push with.
       *
       * Two things were wrong with that. The owner's phone number was sitting
       * in a stranger's browser, which is the exact thing this product
       * promises never happens. And a server that accepts a token from the
       * client will push whatever anyone sends it.
       *
       * So resolution and sending both moved behind the Admin SDK, and the
       * Firestore rules now refuse these reads outright. The page below never
       * learns who the owner is — it gets a colour, a model and a plate, the
       * same three things already printed on the sticker.
       */

      /** Everything the server will tell us about a vehicle, and no more. */
      function emptyOwnerRecord() {
        return {
          id: "",
          qrCodeId: "",
          // The server is the authority on this and answers 404 for a code
          // that is missing *or* switched off, so anything we hold a record
          // for is active by definition. Kept as a field because the render
          // path below still reads it.
          isActive: true,
          // Retained so the components reading them keep working, and as a
          // standing reminder that the client is never given either one.
          fcmToken: "",
          userId: "",
          licensePlate: "",
          carDetails: { color: "", carModel: "", licensePlate: "" },
        };
      }

      function ownerRecordFromApi(data) {
        const vehicle = (data && data.vehicle) || {};
        const record = emptyOwnerRecord();
        record.id = data.qrCodeId || "";
        record.qrCodeId = data.qrCodeId || "";
        record.licensePlate = vehicle.licensePlate || "";
        record.carDetails = {
          color: vehicle.color || "",
          carModel: vehicle.carModel || "",
          licensePlate: vehicle.licensePlate || "",
        };
        return record;
      }

      /**
       * A missing code and a deactivated code deliberately look identical.
       *
       * `isActive: false` is the owner's off switch and the server honours it,
       * but if this page said "that code exists but is switched off" it would
       * become a way to test which codes are real.
       */
      const NOT_ACTIVE_MESSAGE_KEY = "notifyNotActive";

      /**
       * In-flight GETs, keyed by path.
       *
       * Two effects resolve the same QR on mount — one to fill the vehicle
       * description, one to arm the notify target — so without this the page
       * opens with two identical round trips. On a normal page that is
       * untidy; here it is the first thing that happens after someone scans a
       * sticker, on Indian mobile data, while they are standing in the road.
       *
       * Only the promise is shared, and only while it is pending, so a later
       * resolve still re-fetches. Nothing is cached across attempts — a code
       * that was deactivated between two tries must come back 404.
       */
      const inFlightGets = new Map();

      async function apiGet(path) {
        if (inFlightGets.has(path)) return inFlightGets.get(path);
        const pending = apiGetUncached(path).finally(() => {
          inFlightGets.delete(path);
        });
        inFlightGets.set(path, pending);
        return pending;
      }

      async function apiGetUncached(path) {
        const response = await fetch(path, {
          method: "GET",
          headers: { Accept: "application/json" },
        });
        if (response.status === 404) return null;
        if (!response.ok) {
          const detail = await response.json().catch(() => null);
          throw new Error(
            (detail && detail.error && detail.error.message) ||
              "We could not reach Avahanaa. Please check your connection."
          );
        }
        return response.json();
      }

      /**
       * Resolves a scanned QR code to its vehicle description.
       */
      async function fetchOwnerByQr(qrCodeId) {
        if (!qrCodeId) return null;
        try {
          const data = await apiGet(
            `/api/qr/${encodeURIComponent(qrCodeId)}`
          );
          return data ? ownerRecordFromApi(data) : null;
        } catch (error) {
          console.error("Could not resolve QR code", error);
          return null;
        }
      }

      /** Kept under its old name so existing call sites are unchanged. */
      async function fetchUserByQrId(qrId) {
        return fetchOwnerByQr(qrId);
      }

      /**
       * Resolves either a QR id or a typed registration number.
       *
       * The plate branch is a server lookup now (`/api/lookup`) rather than a
       * Firestore query over `users`. It answers with a `qrCodeId` and the
       * vehicle description — never an owner — and it is rate-limited per IP,
       * because unlike a sticker a plate can simply be guessed.
       */
      async function fetchUserByIdOrPlate(identifier) {
        if (!identifier) return null;
        const raw = String(identifier).trim();
        if (!raw) return null;

        // A QR id first: if the scan route gave us one, it is authoritative.
        const direct = await fetchOwnerByQr(raw);
        if (direct) return direct;

        try {
          const data = await apiGet(
            `/api/lookup?plate=${encodeURIComponent(raw)}`
          );
          return data ? ownerRecordFromApi(data) : null;
        } catch (error) {
          console.error("Could not look up that registration number", error);
          return null;
        }
      }

      /**
       * Where the vehicle is, if the person scanning is willing to say.
       *
       * The owner's first question on getting an alert is "which car, and
       * where?" — they may have three vehicles and no idea which windscreen
       * was scanned. A coordinate answers it in one line.
       *
       * Three rules, and they are the reason this is defensible at all:
       *
       * 1. **Never blocking.** The alert is the product; the location is a
       *    nicety. A permission prompt somebody ignores must not stop the
       *    button working, so this resolves to null after six seconds no
       *    matter what the browser is doing.
       * 2. **Never silent.** The browser's own prompt is the consent, and it
       *    only appears after the reason has been chosen, so nobody is asked
       *    for their location before they know what they are sending.
       * 3. **Never precise.** The server rounds to three decimals (~110 m)
       *    before storing. That is enough to find a parked car and not enough
       *    to follow a person — and the person scanning is a stranger doing a
       *    favour, who is owed the same anonymity the owner gets.
       */
      function captureScanLocation() {
        return new Promise((resolve) => {
          if (!navigator.geolocation) {
            resolve(null);
            return;
          }

          let settled = false;
          const finish = (value) => {
            if (settled) return;
            settled = true;
            resolve(value);
          };

          // Belt as well as braces: `timeout` below covers a slow fix, but not
          // a browser that never calls back at all — which is what a dismissed
          // (rather than denied) permission prompt does on some mobile
          // browsers, and somebody is standing in the street waiting.
          const giveUp = setTimeout(() => finish(null), 6000);

          navigator.geolocation.getCurrentPosition(
            (position) => {
              clearTimeout(giveUp);
              finish({
                lat: position.coords.latitude,
                lng: position.coords.longitude,
                accuracyM: position.coords.accuracy,
              });
            },
            () => {
              clearTimeout(giveUp);
              finish(null);
            },
            {
              enableHighAccuracy: false,
              timeout: 5000,
              // A fix from the last two minutes is fine and costs no radio
              // time. Nobody has walked far since.
              maximumAge: 120000,
            }
          );
        });
      }

      /**
       * Sends the alert.
       *
       * The request carries a QR id, a reason code and a note — that is all
       * the server accepts. It resolves the owner itself and pushes with its
       * own credentials, so there is no title, no body and no token here to
       * tamper with.
       *
       * `t` is the caller's translator, so a failure is reported in the
       * language the page is being read in. The wire format does not change.
       */
      async function triggerNotifyFunction(payload, t) {
        try {
          const response = await fetch("/api/notify", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              qrCodeId: payload.qrCodeId || payload.qrId || "",
              reason: payload.reason || "other",
              message: payload.message || "",
              // Omitted entirely when it was declined or unavailable, rather
              // than sent as nulls. The server treats a missing field and a
              // refused one identically, and there is no reason to describe
              // somebody's refusal on the wire.
              ...(payload.location ? { location: payload.location } : {}),
            }),
          });

          if (response.ok) {
            const data = await response.json().catch(() => ({}));
            return {
              ok: true,
              notificationId: data.notificationId || "",
              // The capability that lets this page ask, later, whether the
              // owner answered. Held in memory only — it is deliberately not
              // put in the URL or in storage, because it unlocks one alert's
              // reply status and a URL gets shared.
              statusToken: data.statusToken || "",
            };
          }

          const detail = await response.json().catch(() => null);
          const code = detail && detail.error && detail.error.code;

          // The owner has been alerted already and this is a repeat within the
          // window. Saying so plainly matters: someone standing at the car who
          // thinks nothing happened will keep pressing the button.
          //
          // The server already sends `Retry-After`. Reading it turns "please
          // give them a few minutes" — which is unfalsifiable, so it is read
          // as a brush-off — into a clock that visibly runs down and a button
          // that comes back on its own.
          if (response.status === 429) {
            const retryHeader = Number(response.headers.get("Retry-After"));
            return {
              ok: false,
              alreadyAlerted: true,
              retryAfter:
                Number.isFinite(retryHeader) && retryHeader > 0
                  ? Math.min(retryHeader, 3600)
                  : 0,
              message: t("notifyRateLimited"),
            };
          }

          if (response.status === 404) {
            return { ok: false, message: t(NOT_ACTIVE_MESSAGE_KEY) };
          }

          return {
            ok: false,
            message:
              (detail && detail.error && detail.error.message) ||
              t("notifySendFailed"),
            code: code || "",
          };
        } catch (error) {
          console.error("Notification request failed", error);
          return {
            ok: false,
            message: t("notifyOffline"),
          };
        }
      }

      /**
       * ---------------------------------------------------------------
       * Language

      /** Falls back to English rather than rendering a key name. */
      function translate(lang, key) {
        const table = STRINGS[lang] || STRINGS.en;
        if (Object.prototype.hasOwnProperty.call(table, key)) return table[key];
        return STRINGS.en[key] != null ? STRINGS.en[key] : key;
      }

      const LanguageContext = React.createContext({
        lang: "en",
        setLang: () => {},
        t: (key) => translate("en", key),
      });

      function useT() {
        return React.useContext(LanguageContext);
      }

      function readStored(key, fallback) {
        try {
          const value = localStorage.getItem(key);
          return value == null ? fallback : value;
        } catch (err) {
          return fallback;
        }
      }

      function writeStored(key, value) {
        try {
          localStorage.setItem(key, value);
        } catch (err) {
          /* Private mode. The choice simply does not persist. */
        }
      }

      /**
       * ---------------------------------------------------------------
       * Reasons
       * ---------------------------------------------------------------
       *
       * The seven codes in `docs/backend_contract.md`, and only those. The
       * server rejects anything else outright (`REASONS` in
       * `functions/index.js`) and the app renders these and only these
       * (`NotificationModel.reasonTextIn`).
       *
       * This list used to be six friendly sentences that collapsed onto three
       * codes — "your headlights are on", "your alarm is ringing" and "there
       * is a pet inside" all went out as `other`, so the owner's phone said
       * "Someone needs you at your vehicle" for every one of them. The
       * situations did not disappear; they moved into the hint under `other`,
       * where they belong, and the six codes the app can actually name now get
       * named.
       *
       * `emergency` is the only one that is never metered, and it is styled
       * apart because red here means an alert, not emphasis.
       */
      /*
       * The seven reasons, in the order somebody standing at the vehicle will
       * want them.
       *
       * `code` is the wire value and is frozen: the owner's phone renders the
       * notification title from it (`FCMService._titleFromReason`), so a code
       * this page invents arrives untitled. `key` is only what the *scanner*
       * reads, which never crosses the wire — so the labels below are free to
       * describe the situation rather than the violation.
       *
       * `blocking_driveway` leads, and is labelled "Blocking me in" rather
       * than "Blocking Driveway". The commonest real scan is not a suburban
       * driveway: it is a two-wheeler boxed in by another two-wheeler outside
       * a shop. Titled as a driveway, that person read all seven tiles, found
       * nothing that matched, and picked "Other" — which reaches the owner as
       * the generic "someone needs you at your vehicle" and loses the one fact
       * that would have made them hurry.
       */
      const REASON_OPTIONS = [
        { code: "blocking_driveway", icon: "\u{1F6F5}", key: "reasonBlockingDriveway" },
        { code: "blocking_traffic", icon: "\u{1F6A6}", key: "reasonBlockingTraffic" },
        { code: "double_parked", icon: "\u{1F697}", key: "reasonDoubleParked" },
        { code: "illegal_parking", icon: "\u{1F6AB}", key: "reasonIllegalParking" },
        { code: "private_property", icon: "\u{1F3E0}", key: "reasonPrivateProperty" },
        { code: "other", icon: "\u{1F4AC}", key: "reasonOther" },
        // Last, and on its own row, because it is the one that is never
        // metered and the one nobody should hit by accident.
        { code: "emergency", icon: "\u{1F198}", key: "reasonEmergency", emergency: true },
      ];

      /*
       * The sentence the owner reads when the scanner adds no note of their
       * own.
       *
       * This used to compose "A visitor has selected the reason: Blocking
       * Driveway." — the shape of a form submission, not of a person asking
       * for help, and it made the owner do the translation from a category
       * name to a thing that is happening to their vehicle right now.
       *
       * Always English, whatever language the page is being read in: the body
       * is passed through to the owner verbatim and this page cannot know
       * which language *they* read. The owner's app localises the title from
       * the code; this is the line underneath it.
       */
      const REASON_BODY = {
        blocking_driveway: "bodyBlockingDriveway",
        blocking_traffic: "bodyBlockingTraffic",
        double_parked: "bodyDoubleParked",
        illegal_parking: "bodyIllegalParking",
        private_property: "bodyPrivateProperty",
        emergency: "bodyEmergency",
        other: "bodyOther",
      };

      /*
       * The headline the owner's phone puts above it.
       *
       * A mirror of `TITLES` in `functions/index.js`, which is itself a mirror
       * of `FCMService._titleFromReason`. It exists here for one reason: to
       * show the person about to send exactly what they are about to set off.
       *
       * Nothing on the wire reads this map. The owner's own app renders the
       * real title from the reason code, in the owner's language — so this is
       * a faithful preview of the alert, not the alert.
       */
      const PREVIEW_TITLES = {
        blocking_driveway: "previewTitleBlockingDriveway",
        blocking_traffic: "previewTitleBlockingTraffic",
        double_parked: "previewTitleDoubleParked",
        illegal_parking: "previewTitleIllegalParking",
        private_property: "previewTitlePrivateProperty",
        emergency: "previewTitleEmergency",
        other: "previewTitleOther",
      };

      /*
       * One-tap notes.
       *
       * Two jobs. The first is speed: somebody holding a phone in one hand at
       * a kerb will not type, so the note field stays empty and the owner gets
       * a category where a sentence would have got them moving.
       *
       * The second is coverage. Comparable products offer a dozen situations —
       * lights left on, alarm ringing, a flat tyre, a pet inside, a tow truck
       * arriving. Our wire has seven codes and cannot grow one without the
       * Flutter app shipping the matching string first. So the specific
       * situation rides in the note, which the server passes through verbatim
       * as the notification body: the code stays `other`, and the owner still
       * reads "Your headlights are on" rather than "someone needs you".
       *
       * Tapping a chip a second time clears it, so a mis-tap costs one tap.
       */
      const NOTE_PRESETS = {
        blocking_driveway: ["notePresetCantGetOut", "notePresetWaitingHere", "notePresetNoRush"],
        blocking_traffic: ["notePresetHoldingUp", "notePresetPleaseHurry"],
        double_parked: ["notePresetCantGetOut", "notePresetWaitingHere"],
        illegal_parking: ["notePresetTowRisk", "notePresetNoRush"],
        private_property: ["notePresetPrivateMove", "notePresetNoRush"],
        other: [
          "notePresetLightsOn",
          "notePresetAlarm",
          "notePresetFlatTyre",
          "notePresetPetInside",
          "notePresetWindowOpen",
          "notePresetTowTruck",
          "notePresetDamage",
          "notePresetFallen",
        ],
        emergency: ["notePresetEmergencyHelp", "notePresetEmergencyCalled"],
      };

      /**
       * ---------------------------------------------------------------
       * Theme
       * ---------------------------------------------------------------
       *
       * Three states, matching `ThemeController` in the app: an explicit
       * light, an explicit dark, and `system` — which writes no attribute at
       * all and leaves the media query in theme.css in charge.
       *
       * The initial value is read from the DOM rather than from storage,
       * because the inline script in <head> has already applied it before
       * this bundle was parsed. Reading it twice is how the two get to
       * disagree.
       */
      function useTheme() {
        const [theme, setThemeState] = useState(
          () => document.documentElement.getAttribute("data-theme") || "system"
        );

        const setTheme = useCallback((next) => {
          if (next === "system") {
            document.documentElement.removeAttribute("data-theme");
          } else {
            document.documentElement.setAttribute("data-theme", next);
          }
          writeStored("avahanaa.theme", next);
          setThemeState(next);
        }, []);

        // What the toggle would switch to, given what is actually on screen.
        // With `system` selected that depends on the OS, not on our state.
        const resolved = useMemo(() => {
          if (theme === "light" || theme === "dark") return theme;
          return window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }, [theme]);

        return { theme, resolved, setTheme };
      }

      /**
       * Language, persisted, and reflected onto <html lang> so the Kannada
       * font stack in theme.css applies and screen readers switch voice.
       */
      function useLanguage() {
        const [lang, setLangState] = useState(() => {
          const stored = readStored("avahanaa.lang", "");
          if (stored === "en" || stored === "kn") return stored;
          // A Kannada-preferring browser gets Kannada without being asked.
          const nav = (navigator.language || "").toLowerCase();
          return nav.startsWith("kn") ? "kn" : "en";
        });

        useEffect(() => {
          document.documentElement.setAttribute("lang", lang);
        }, [lang]);

        const setLang = useCallback((next) => {
          writeStored("avahanaa.lang", next);
          setLangState(next);
        }, []);

        const t = useCallback((key) => translate(lang, key), [lang]);

        return { lang, setLang, t };
      }

      /** Builds a same-site page link, preserving the `?page=` routing. */
      function pageHref(page) {
        return page ? `/index.html?page=${page}` : "/index.html";
      }

      /**
       * Navbar
       */
      function Navbar({ page }) {
        const { t, lang, setLang } = useT();
        const { resolved, setTheme } = useTheme();
        const [open, setOpen] = useState(false);
        const [scrolled, setScrolled] = useState(false);

        // The border under the bar appears only once the page has moved. On a
        // hero that runs to the top edge, a line sitting on top of the metal
        // from the first frame reads as a seam.
        useEffect(() => {
          const onScroll = () => setScrolled(window.scrollY > 4);
          onScroll();
          window.addEventListener("scroll", onScroll, { passive: true });
          return () => window.removeEventListener("scroll", onScroll);
        }, []);

        // A menu that stays open after the viewport grows is a menu floating
        // over content nobody asked to cover.
        useEffect(() => {
          const mq = window.matchMedia("(min-width: 992px)");
          const onChange = () => { if (mq.matches) setOpen(false); };
          mq.addEventListener("change", onChange);
          return () => mq.removeEventListener("change", onChange);
        }, []);

        const links = [
          { page: "", key: "navHome" },
          { page: "features", key: "navFeatures" },
          { page: "plans", key: "navPlans" },
          { page: "notify", key: "navNotify" },
          { page: "about", key: "navAbout" },
          { page: "contact", key: "navContact" },
        ];

        const nextLang = lang === "en" ? "kn" : "en";
        const nextLangLabel = LANGUAGES.find((l) => l.id === nextLang).label;

        return (
          <nav className="av-nav" data-scrolled={scrolled ? "true" : "false"}>
            <div className="container av-nav__inner">
              <a className="av-brand" href="/index.html">
                <img className="av-brand__mark" src="/logo.jpg" alt="" width="34" height="34" />
                <span>Avahanaa</span>
              </a>

              <ul
                className="av-nav__links"
                id="av-nav-links"
                data-open={open ? "true" : "false"}
              >
                {links.map((link) => (
                  <li key={link.key}>
                    <a
                      className="av-nav__link"

      /**
       * Home page
       */
      function HomePage() {
        const { t } = useT();
        const [scanning, setScanning] = useState(false);
        const [cameraDevices, setCameraDevices] = useState([]);
        const [selectedCameraId, setSelectedCameraId] = useState("");
        const [cameraError, setCameraError] = useState("");
        const [initialisingCamera, setInitialisingCamera] = useState(false);
        const scannerRef = useRef(null);
        const hasProcessedScanRef = useRef(false);

        const qrConfig = useMemo(
          () => ({ fps: 10, qrbox: { width: 250, height: 250 } }),
          []
        );

        const cleanupScanner = useCallback(async () => {
          const activeScanner = scannerRef.current;
          if (!activeScanner) {
            return;
          }
          try {
            await activeScanner.stop();
          } catch (stopErr) {
            console.warn("Scanner stop failed", stopErr);
          }
          try {
            await activeScanner.clear();
          } catch (clearErr) {
            console.warn("Scanner clear failed", clearErr);
          }
          scannerRef.current = null;
        }, []);

        const stopScan = useCallback(async () => {
          setInitialisingCamera(false);
          setScanning(false);
          hasProcessedScanRef.current = false;
          await cleanupScanner();
        }, [cleanupScanner]);

        const requestCameraPermission = useCallback(async () => {
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            throw new Error(
              "Camera access is not supported in this browser. Please try a different device."
            );
          }
          let stream = null;
          try {
            stream = await navigator.mediaDevices.getUserMedia({
              video: { facingMode: { ideal: "environment" } },
            });
          } finally {
            if (stream) {
              stream.getTracks().forEach((track) => track.stop());
            }
          }
        }, []);

        useEffect(() => {
          return () => {
            cleanupScanner().catch(() => {});
          };
        }, [cleanupScanner]);

        const handleScanSuccess = useCallback(
          async (decodedText) => {
            const trimmedText = (decodedText || "").trim();
            if (!trimmedText) {
              return;
            }
            if (hasProcessedScanRef.current) {
              return;
            }
            hasProcessedScanRef.current = true;

            let identifier = trimmedText;
            const params = new URLSearchParams();
            try {
              const candidateUrl = new URL(trimmedText, window.location.origin);
              const candidateParams = new URLSearchParams(candidateUrl.search);
              // Remove routing hints from legacy links
              candidateParams.delete("page");
              const qrFromQuery =
                candidateParams.get("qr") ||
                candidateParams.get("id") ||
                candidateParams.get("vehicle");
              const shortRoute = parseShortNotifyRoute(candidateUrl.pathname);
              const qrFromUrl = qrFromQuery || (shortRoute ? shortRoute.qrId : "");
              if (qrFromUrl) {
                identifier = qrFromUrl;
                candidateParams.set("qr", qrFromUrl);
              }
              candidateParams.forEach((value, key) => {
                if (value != null && value !== "") {
                  params.set(key, value);
                }
              });
            } catch (err) {
              // Not a URL, fall back to using the decoded string directly.
            }

            if (!params.has("qr") && identifier) {
              params.set("qr", identifier);
            }

            if (!params.has("payload")) {
              const detailKeys = ["carModel", "licensePlate", "color"];
              const detailPayload = {};
              detailKeys.forEach((key) => {
                const rawValue = params.get(key);
                if (typeof rawValue === "string" && rawValue.trim()) {
                  detailPayload[key] = rawValue.trim();
                }
              });
              if (Object.keys(detailPayload).length > 0) {
                try {
                  const encrypted = await encryptQrPayload(detailPayload);
                  if (encrypted) {
                    params.set("payload", encrypted);
                    if (!params.has("v")) {
                      params.set("v", "1");
                    }
                    detailKeys.forEach((key) => params.delete(key));
                  }
                } catch (encryptionError) {
                  console.warn(
                    "Failed to encrypt car details for QR redirect",
                    encryptionError
                  );
                }
              }
            }

            params.set("page", "notify");
            const targetHref = `/index.html${
              params.toString() ? `?${params.toString()}` : ""
            }`;

            try {
              await cleanupScanner();
            } catch (cleanupErr) {
              console.warn("Scanner cleanup failed", cleanupErr);
            }
            setScanning(false);
            setInitialisingCamera(false);
            setCameraError("");
            window.location.href = targetHref;
          },
          [cleanupScanner]
        );

        const startScan = useCallback(
          async (preferredCameraId) => {
            const Html5Qrcode = window.Html5Qrcode;
            if (!Html5Qrcode) {
              setCameraError(
                "QR scanner module failed to load. Please refresh the page."
              );
              return;
            }
            if (typeof window !== "undefined" && !window.isSecureContext) {
              setCameraError(
                "Camera access is blocked because this page is not loaded over HTTPS. Please open the secure Avahanaa site."
              );
              return;
            }
            setCameraError("");
            setScanning(true);
            setInitialisingCamera(true);
            hasProcessedScanRef.current = false;
            try {
              await requestCameraPermission();
              let cameras = cameraDevices;
              if (!cameras.length) {
                cameras = (await Html5Qrcode.getCameras()) || [];
                setCameraDevices(cameras);
              }
              if (!cameras.length) {
                throw new Error(
                  "No cameras were detected on this device. Try another device."
                );
              }
              let cameraId = preferredCameraId || selectedCameraId;
              if (!cameraId || !cameras.some((camera) => camera.id === cameraId)) {
                const rearCamera =
                  cameras.find((camera) =>
                    /back|rear|environment/i.test(camera.label || "")
                  ) || cameras[0];
                cameraId = rearCamera.id;
              }
              setSelectedCameraId(cameraId);

              let activeScanner = scannerRef.current;
              if (!activeScanner) {
                activeScanner = new Html5Qrcode("qr-reader", {
                  experimentalFeatures: { useBarCodeDetectorIfSupported: true },
                });
                scannerRef.current = activeScanner;
              } else {
                try {
                  await activeScanner.stop();
                } catch {
                  // ignore stop errors while switching cameras
                }
              }

              await activeScanner.start(
                { deviceId: { exact: cameraId } },
                qrConfig,
                handleScanSuccess,
                () => {}
              );
              setCameraError("");
            } catch (error) {
              console.error("Failed to start QR scanning", error);
              let message =
                error?.message ||
                "Unable to access the camera. Please grant permission and try again.";
              if (error?.name === "NotAllowedError") {
                message =
                  "Camera permission was blocked. Please allow access from your browser settings and try again.";
              } else if (error?.name === "NotFoundError") {
                message =
                  "No usable camera was found on this device. Try connecting a camera or using a different device.";
              }
              setCameraError(message);
              setScanning(false);
              await cleanupScanner();
            } finally {
              setInitialisingCamera(false);
            }
          },
          [
            cameraDevices,
            cleanupScanner,
            handleScanSuccess,
            qrConfig,
            requestCameraPermission,
            selectedCameraId,
          ]
        );

        const handleCameraChange = useCallback(
          (event) => {
            const newCameraId = event.target.value;
            setSelectedCameraId(newCameraId);
            if (scanning) {
              startScan(newCameraId);
            }
          },
          [scanning, startScan]
        );

        return (
          <div>
            <section className="av-hero av-hero--home">
              <div className="container">
                <div className="av-hero__inner">
                  <span className="av-hero__eyebrow">{t("homeEyebrow")}</span>
                  <h1 className="av-hero__title">{t("homeTitle")}</h1>
                  <p className="av-hero__lead">{t("homeLead")}</p>
                  {!scanning && (
                    <div className="av-hero__actions">
                      <button
                        type="button"
                        className="av-btn av-btn--primary av-btn--lg"
                        onClick={() => startScan()}
                        disabled={initialisingCamera}
                      >
                        <span aria-hidden="true">{"\u{1F4F7}"}</span>
                        {initialisingCamera ? t("homeScanning") : t("homeScan")}
                      </button>
                      <a
                        className="av-btn av-btn--on-metal av-btn--lg"
                        href={pageHref("notify")}
                      >
                        {t("homeEnterPlate")}
                      </a>
                    </div>
                  )}
                  <p className="av-hero__note">{t("homeHeroNote")}</p>
                  {!scanning && cameraError && (
                    <div className="av-notice av-notice--warning mt-3" role="alert">
                      <span className="av-notice__icon" aria-hidden="true">{"⚠️"}</span>
                      <p>{cameraError}</p>
                    </div>
                  )}
                </div>
              </div>
            </section>

            {scanning && (
              <section className="av-section av-section--tight av-section--muted">
                <div className="container container--narrow text-center">
                  <h2 className="mb-2">{t("homeScanHeading")}</h2>
                  <p className="text-tertiary small mb-4">{t("homeScanHelp")}</p>
                  {cameraDevices.length > 1 && (
                    <div className="mb-3" style={{ maxWidth: "340px", margin: "0 auto var(--space-lg)" }}>
                      <label className="av-label" htmlFor="cameraSelect">
                        {t("homeChooseCamera")}
                      </label>
                      <select
                        id="cameraSelect"
                        className="av-select"
                        value={selectedCameraId}
                        onChange={handleCameraChange}
                        disabled={initialisingCamera}
                      >
                        {cameraDevices.map((camera, index) => (
                          <option key={camera.id} value={camera.id}>
                            {camera.label || `Camera ${index + 1}`}
                          </option>
                        ))}
                      </select>
                    </div>
                  )}
                  <div id="qr-reader" className="av-scanner"></div>
                  {initialisingCamera && (
                    <p className="text-tertiary small mt-3">{t("homeCameraPreparing")}</p>
                  )}
                  {cameraError && (
                    <div className="av-notice av-notice--warning mt-3" role="alert">
                      <span className="av-notice__icon" aria-hidden="true">{"⚠️"}</span>
                      <p>{cameraError}</p>
                    </div>
                  )}
                  <div className="av-row mt-4" style={{ justifyContent: "center" }}>
                    {cameraError && (
                      <button
                        type="button"
                        className="av-btn av-btn--primary"
                        onClick={() => startScan(selectedCameraId)}
                        disabled={initialisingCamera}
                      >
                        {t("homeTryAgain")}
                      </button>
                    )}
                    <button
                      type="button"
                      className="av-btn av-btn--secondary"
                      onClick={() => stopScan()}
                      disabled={initialisingCamera}
                    >
                      {t("homeCancel")}
                    </button>
                  </div>
                </div>
              </section>
            )}

            <section className="av-section">
              <div className="container">
                <SectionHead
                  center
                  eyebrow={t("homeHowEyebrow")}

                />
                <div className="av-grid av-grid--3">

        // Two headlines, because the sticker is scanned for two different
        // reasons. Somebody who came here from a QR code is nine times out of
        // ten blocked by the vehicle they scanned, and naming that is what
        // makes the page feel like it was written for them. Somebody who typed
        // a plate could be doing anything, so that one stays open.
        const blockedFraming = Boolean(initialQr);

        return (
          <section className="av-scan">
            <div className="container container--narrow">
              <div className="av-scan__head">
                <h1 className="mb-2">
                  {blockedFraming ? t("notifyTitle") : t("notifyTitleGeneric")}
                </h1>
                <p className="lead mb-0">
                  {blockedFraming ? t("notifyLead") : t("notifyLeadGeneric")}
                </p>
              </div>

              <ScanAssurances />

              <VehicleCard
                plate={displayPlate}
                carModel={carDetails.carModel}
                color={carDetails.color}
                identifier={displayIdentifier}
                // Resolved by either route — the sticker (`ownerFromQr`) or a
                // typed plate (`user`). Keyed off only the first, this sat on
                // "checking…" forever for anybody who typed a number plate,
                // which is the fallback people reach for when the sticker is
                // scratched and exactly when they least need to be told the
                // lookup might not have worked.
                status={ownerFromQr || user ? "active" : "pending"}
              />

              <form onSubmit={handleSubmit} className="av-form">
                <fieldset className="av-block">
                  <legend className="av-block__head">
                    <span className="av-block__n" aria-hidden="true">1</span>
                    <span className="av-block__text">
                      <span className="av-block__title">{t("notifyReasonLabel")}</span>
                      <span className="av-block__hint">{t("notifyReasonHelp")}</span>
                    </span>
                  </legend>
                  <ReasonGrid reason={reason} onPick={setReason} />
                </fieldset>

                {/* Everything below stays out of the way until there is a
                    reason. Showing a note field, a contact toggle and an empty
                    preview to somebody who has not answered the first question
                    is three decisions offered before the one that matters. */}
                {reason && (
                  <div className="av-block av-reveal" key={reason}>
                    <div className="av-block__head">
                      <span className="av-block__n" aria-hidden="true">2</span>
                      <span className="av-block__text">
                        <span className="av-block__title">
                          {noteRequired ? t("notifyNoteRequiredLabel") : t("notifyNoteLabel")}
                        </span>
                        <span className="av-block__hint">
                          {noteRequired ? t("reasonOtherHint") : t("notifyNoteOptional")}
                        </span>
                      </span>
                    </div>

                    <NotePresets reason={reason} message={message} onPick={setMessage} />

                    <div className="av-field">
                      <label className="visually-hidden" htmlFor="notify-note">
                        {noteRequired ? t("notifyNoteRequiredLabel") : t("notifyNoteLabel")}
                      </label>
                      <textarea
                        id="notify-note"
                        className="av-textarea"
                        rows="2"
                        maxLength={NOTE_MAX_LENGTH}
                        value={message}
                        onChange={(e) => setMessage(e.target.value)}
                        placeholder={
                          noteRequired
                            ? t("notifyNoteRequiredPlaceholder")
                            : t("notifyNotePlaceholder")
                        }
                      ></textarea>
                      {/* Only near the ceiling. A counter that is always on
                          reads as a limit being enforced on you; one that
                          appears at 60 characters left is a warning. */}
                      {noteRemaining <= 60 && (
                        <p className="av-help av-help--count mb-0">
                          {t("notifyNoteCount").replace("{n}", String(noteRemaining))}
                        </p>
                      )}
                    </div>

                    <AlertPreview
                      reason={reason}
                      message={message}
                      shareContact={shareContact}
                      contact={contact}
                    />

                    <label className="av-switch">
                      <input
                        type="checkbox"
                        checked={shareContact}
                        onChange={(e) => {
                          setShareContact(e.target.checked);
                          if (!e.target.checked) {
                            setContact("");
                          }
                        }}
                      />
                      <span className="av-switch__track" aria-hidden="true"></span>
                      <span className="av-switch__label">{t("notifyShareContact")}</span>
                    </label>
                    <p className="av-help mb-0">{t("notifyShareContactHelp")}</p>

                    {shareContact && (
                      <div className="av-field av-reveal">
                        <label className="av-label" htmlFor="notify-contact">
                          {t("notifyContactLabel")}
                        </label>
                        <input
                          id="notify-contact"
                          type="text"
                          className="av-input"
                          placeholder={t("notifyContactPlaceholder")}
                          value={contact}
                          onChange={(e) => setContact(e.target.value)}
                        />
                        <p className="av-help mb-0">{t("notifyContactHelp")}</p>
                      </div>
                    )}
                  </div>
                )}

                {/* Sticky rather than duplicated. One send button, in flow at
                    the foot of the form, that pins itself to the bottom of the
                    viewport while the form is taller than the screen — so the
                    thing they came here to do is never more than a thumb-reach
                    away, and there is no second copy to double-submit. */}
                <div className="av-send" data-armed={reason ? "true" : "false"}>
                  <button
                    id="notifyOwnerBtn"
                    type="submit"
                    // Not green until it will actually send. A full-strength
                    // send button that does nothing when pressed teaches
                    // people that the button does nothing.
                    className={`av-btn av-btn--block av-btn--lg ${
                      !reason
                        ? "av-btn--secondary"
                        : reason === "emergency"
                        ? "av-btn--emergency"
                        : "av-btn--send"
                    }`}
                    disabled={sendDisabled}
                  >
                    {sending ? (
                      <>
                        <span className="av-spinner av-spinner--sm" aria-hidden="true"></span>
                        {t("notifySending")}
                      </>
                    ) : throttled ? (
                      `${t("notifyRateLimitedWait")} ${formatClock(retryLeft)}`
                    ) : !reason ? (
                      t("notifyPickReasonFirst")
                    ) : reason === "emergency" ? (
                      t("notifySendEmergency")
                    ) : (
                      t("notifySend")
                    )}
                  </button>
                  {notifyFeedback.message && (
                    <p
                      id="notifyOwnerFeedback"
                      className={`small mt-2 mb-0 ${feedbackClass}`}
                      role="status"
                      aria-live="polite"
                    >
                      {notifyFeedback.message}
                    </p>
                  )}
                </div>
              </form>

              {/* Below the fold on purpose. Somebody who is blocked in does
                  not read this; somebody hesitating does, and it answers the
                  three things they are hesitating about. */}
              <div className="av-scan__explain">
                <div className="av-card">
                  <h4 className="av-card__title">{t("notifyHowTitle")}</h4>
                  <ol className="av-howlist">
                    <li>{t("notifyHow1")}</li>
                    <li>{t("notifyHow2")}</li>
                    <li>{t("notifyHow3")}</li>
                    <li>{t("notifyHow4")}</li>
                  </ol>
                </div>
                <div className="av-card av-card--info">
                  <h4 className="av-card__title">{t("featLocationTitle")}</h4>
                  <p className="small mb-0">{t("notifyLocationNote")}</p>
                </div>
                <div className="av-card av-card--muted">
                  <p className="small mb-0">{t("sentPrivacy")}</p>
                </div>
              </div>
            </div>
          </section>
        );
      }

      /**
       * The chrome a scan gets.
       *
       * Not the site navigation. Somebody who has just pointed a camera at a
       * sticker because a bike is blocking theirs has one job on this page,
       * and a bar offering Home, Features, Plans, About and Contact is five
       * ways off it — every one of them a way to lose the alert they came to
       * send. What survives is the brand, so they know who they are trusting,
       * and the two controls that decide whether they can read the page at
       * all: language, and light or dark.
       *
       * Language especially. This ships in Bangalore, the person is doing the
       * owner a favour, and asking them to work through a second language
       * first is the wrong way round — so the toggle is a labelled control
       * here rather than the two-letter icon button it is on the marketing
       * pages.
       */
      function ScanBar() {
        const { t, lang, setLang } = useT();
        const { resolved, setTheme } = useTheme();
        const nextLang = lang === "en" ? "kn" : "en";
        const nextLangLabel = LANGUAGES.find((l) => l.id === nextLang).label;

        return (
          <header className="av-scanbar">
            <div className="container av-scanbar__inner">
              <a className="av-brand av-brand--sm" href="/index.html">
                <img className="av-brand__mark" src="/logo.jpg" alt="" width="28" height="28" />
                <span>Avahanaa</span>
              </a>
              <div className="av-scanbar__tools">
                <button
                  type="button"
                  className="av-btn av-btn--ghost av-btn--chip"
                  onClick={() => setLang(nextLang)}
                  aria-label={t("navLanguage")}
                >
                  {nextLangLabel}
                </button>
                <button
                  type="button"
                  className="av-icon-btn"
                  onClick={() => setTheme(resolved === "dark" ? "light" : "dark")}
                  aria-label={resolved === "dark" ? t("navThemeLight") : t("navThemeDark")}
                >
                  <span aria-hidden="true">{resolved === "dark" ? "☀️" : "\u{1F319}"}</span>
                </button>
              </div>
            </div>
          </header>
        );
      }

      /** Three links and a line. The full sitemap is not what this moment is for. */
      function ScanFooter() {
        const { t } = useT();
        return (
          <footer className="av-scanfoot">
            <div className="container">
              <p className="mb-0">{t("notifyFreeNote")}</p>
              <p className="mb-0">
                <a href="/privacy-policy.html">{t("navPrivacy")}</a>
                <span aria-hidden="true"> · </span>
                <a href="/terms-and-conditions.html">{t("navTerms")}</a>
                <span aria-hidden="true"> · </span>
                <a href={pageHref("")}>{t("navHome")}</a>
              </p>
            </div>
          </footer>
        );
      }

      /**
       * Main App component which selects the page based on URL.
       */
      function App() {
        const language = useLanguage();
        const params = getCurrentRouteParams();
        const page = params.get("page") || "";
        // A scan, as opposed to somebody browsing to the Notify page from the
        // menu: the sticker route filled in `qr`, or a plate came in on the
        // URL. Only that gets the stripped chrome — the Notify link in the nav
        // still lands on the ordinary site.
        const isScan =
          page === "notify" &&
          Boolean(
            (params.get("qr") || "").trim() ||
              (params.get("id") || "").trim() ||
              (params.get("vehicle") || "").trim() ||
              (params.get("payload") || "").trim()
          );
        let Component;
        switch (page) {
          case "contact":
            Component = ContactPage;
            break;
          case "notify":
            Component = NotifyPage;
            break;
          case "about":
            Component = AboutPage;
            break;
          case "features":
            Component = FeaturesPage;
            break;
          case "plans":
            Component = PlansPage;
            break;
          default:
            Component = HomePage;
        }
        return (
          <LanguageContext.Provider value={language}>
            {isScan ? <ScanBar /> : <Navbar page={page} />}
            <main>
              <Component />
            </main>
            {isScan ? <ScanFooter /> : <Footer />}
          </LanguageContext.Provider>
        );
      }

      // Use React 18 concurrent root API
      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
